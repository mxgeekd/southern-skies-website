<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Southern Skies Agritech — Compare</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.7.3/dist/maplibre-gl.css">
<style>
html,body,#shell{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;overflow:hidden}#shell{position:relative}.map{position:absolute;inset:0}.rightWrap{position:absolute;inset:0;overflow:hidden;pointer-events:none}.panel{position:absolute;z-index:10;top:12px;left:12px;background:#fffffff3;padding:14px;border-radius:12px;width:min(390px,calc(100vw - 24px));box-shadow:0 6px 24px #0003}.ey{font-size:11px;letter-spacing:.08em;color:#1f6f43;font-weight:800;text-transform:uppercase}.panel h1{margin:4px 0 2px;font-size:20px}.meta{color:#657268;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.box{border:1px solid #dbe4dd;border-radius:10px;padding:8px;background:#f8faf9}.box strong{display:block;font-size:11px;text-transform:uppercase;margin-bottom:6px}select{width:100%;padding:8px;border:1px solid #ccd8d0;border-radius:8px;background:#fff;margin-bottom:6px;font-weight:700}.row{display:flex;gap:7px;margin-top:10px}.btn{border:1px solid #cfd9d2;background:#f7faf8;padding:8px 10px;border-radius:8px;font-weight:700;cursor:pointer}.btn.active{background:#1f6f43;color:#fff;border-color:#1f6f43}.handle{position:absolute;z-index:9;top:0;bottom:0;width:3px;background:#fff;box-shadow:0 0 0 1px #0003;cursor:ew-resize;touch-action:none}.knob{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 3px 12px #0004;font-size:20px}.label{position:absolute;z-index:8;top:12px;background:#fffffff0;border-radius:8px;padding:7px 9px;font-size:12px;font-weight:800}.leftLab{left:420px}.rightLab{right:50px}
@media(max-width:760px){.panel{top:auto;bottom:0;left:0;width:100vw;border-radius:14px 14px 0 0;padding:10px}.panel h1,.meta{display:none}.grid{margin-top:5px}.leftLab{left:8px}.rightLab{right:45px}.label{top:8px;font-size:11px}.row{margin-top:6px}.btn{padding:7px 8px}}
</style></head>
<body><div id="shell"><div id="leftMap" class="map"></div><div id="rightWrap" class="rightWrap"><div id="rightMap" class="map"></div></div></div>
<div class="panel"><div class="ey">Southern Skies Agritech</div><h1 id="title">Compare</h1><div class="meta" id="meta"></div>
<div class="grid"><div class="box"><strong>Left</strong><select id="leftDate"></select><select id="leftLayer"></select></div><div class="box"><strong>Right</strong><select id="rightDate"></select><select id="rightLayer"></select></div></div>
<div class="row"><button class="btn active" id="mapBtn">Map</button><button class="btn" id="satBtn">Satellite</button><button class="btn" id="fitBtn">Fit</button><button class="btn" id="centreBtn">Centre swipe</button></div></div>
<div class="label leftLab" id="leftLab"></div><div class="label rightLab" id="rightLab"></div><div class="handle" id="handle"><div class="knob">↔</div></div>
<script src="/maps/config.js"></script><script src="https://unpkg.com/maplibre-gl@5.7.3/dist/maplibre-gl.js"></script>
<script>
(async function(){
const q=new URLSearchParams(location.search),client=q.get('client'),pid=q.get('paddock'),leftQ=q.get('left'),rightQ=q.get('right'),layerQ=q.get('layer')||'ndvi';
const data=await fetch(`/portal/${client}/property.json`).then(r=>r.json()),p=data.paddocks.find(x=>x.id===pid);
let left=p.surveys.find(x=>x.date===leftQ)||p.surveys[0], right=p.surveys.find(x=>x.date===rightQ)||p.surveys[p.surveys.length-1], leftK=left.layers[layerQ]?layerQ:Object.keys(left.layers)[0], rightK=right.layers[layerQ]?layerQ:Object.keys(right.layers)[0];
document.getElementById('title').textContent=p.name;document.getElementById('meta').textContent=data.name;
const key=window.SSA_CONFIG?.ESRI_API_KEY||'';
let style={version:8,sources:{},layers:[]},ids=[];
try{const r=await fetch(`https://basemapstyles-api.arcgis.com/arcgis/rest/services/styles/v2/styles/arcgis/imagery/standard?token=${encodeURIComponent(key)}`);if(r.ok)style=await r.json()}catch(e){}
style.sources=style.sources||{};style.layers=style.layers||[];ids=style.layers.map(l=>l.id);style.layers.forEach(l=>{l.layout=l.layout||{};l.layout.visibility='none'});style.sources.ssa_osm={type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap contributors'};style.layers.unshift({id:'ssa-osm',type:'raster',source:'ssa_osm',layout:{visibility:'visible'}});
const lm=new maplibregl.Map({container:'leftMap',style:JSON.parse(JSON.stringify(style)),center:left.center,zoom:16}), rm=new maplibregl.Map({container:'rightMap',style:JSON.parse(JSON.stringify(style)),center:left.center,zoom:16,interactive:false,attributionControl:false});
lm.addControl(new maplibregl.NavigationControl(),'top-right');
const ld=document.getElementById('leftDate'),rd=document.getElementById('rightDate'),ll=document.getElementById('leftLayer'),rl=document.getElementById('rightLayer');
function fillDates(sel,val){sel.innerHTML='';p.surveys.forEach(s=>{const o=document.createElement('option');o.value=s.date;o.textContent=s.dateLabel;sel.appendChild(o)});sel.value=val.date}
function fillLayers(sel,s,k){sel.innerHTML='';Object.entries(s.layers).forEach(([id,L])=>{const o=document.createElement('option');o.value=id;o.textContent=L.label;sel.appendChild(o)});if(!s.layers[k])k=Object.keys(s.layers)[0];sel.value=k;return k}
fillDates(ld,left);fillDates(rd,right);leftK=fillLayers(ll,left,leftK);rightK=fillLayers(rl,right,rightK);
function b4(s){return [s.bounds[0][0],s.bounds[0][1],s.bounds[1][0],s.bounds[1][1]]}
function add(m,src,id,s,k){if(m.getLayer(id))m.removeLayer(id);if(m.getSource(src))m.removeSource(src);const L=s.layers[k];m.addSource(src,{type:'raster',tiles:[L.tiles],tileSize:256,minzoom:L.minzoom||14,maxzoom:L.maxzoom||20,scheme:L.scheme||'tms',bounds:b4(s)});m.addLayer({id,type:'raster',source:src})}
function labels(){document.getElementById('leftLab').textContent=`${left.dateLabel} · ${left.layers[leftK].label}`;document.getElementById('rightLab').textContent=`${right.dateLabel} · ${right.layers[rightK].label}`}
function refresh(){if(lm.loaded()&&rm.loaded()){add(lm,'ls','li',left,leftK);add(rm,'rs','ri',right,rightK);labels()}}
function sync(){const c=lm.getCenter();rm.jumpTo({center:[c.lng,c.lat],zoom:lm.getZoom(),bearing:lm.getBearing(),pitch:lm.getPitch()})} lm.on('move',sync);
let x=innerWidth/2,drag=false;const wrap=document.getElementById('rightWrap'),rdiv=document.getElementById('rightMap'),handle=document.getElementById('handle');
function clip(){x=Math.max(0,Math.min(x,innerWidth));handle.style.left=(x-1.5)+'px';wrap.style.left=x+'px';rdiv.style.left=(-x)+'px';rdiv.style.width=innerWidth+'px';rdiv.style.height=innerHeight+'px';rm.resize();sync()}
Promise.all([new Promise(r=>lm.on('load',r)),new Promise(r=>rm.on('load',r))]).then(()=>{refresh();lm.fitBounds(left.bounds,{padding:50,maxZoom:19});clip()});
ld.onchange=()=>{left=p.surveys.find(s=>s.date===ld.value);leftK=fillLayers(ll,left,leftK);refresh()};rd.onchange=()=>{right=p.surveys.find(s=>s.date===rd.value);rightK=fillLayers(rl,right,rightK);refresh()};ll.onchange=()=>{leftK=ll.value;refresh()};rl.onchange=()=>{rightK=rl.value;refresh()};
function base(sat){[lm,rm].forEach(m=>{if(m.getLayer('ssa-osm'))m.setLayoutProperty('ssa-osm','visibility',sat?'none':'visible');ids.forEach(id=>{if(m.getLayer(id))m.setLayoutProperty(id,'visibility',sat?'visible':'none')})});document.getElementById('mapBtn').classList.toggle('active',!sat);document.getElementById('satBtn').classList.toggle('active',sat)}
document.getElementById('mapBtn').onclick=()=>base(false);document.getElementById('satBtn').onclick=()=>base(true);document.getElementById('fitBtn').onclick=()=>lm.fitBounds(left.bounds,{padding:50,maxZoom:19});document.getElementById('centreBtn').onclick=()=>{x=innerWidth/2;clip()};
handle.onmousedown=e=>{drag=true;e.preventDefault()};handle.ontouchstart=e=>{drag=true;e.preventDefault()};addEventListener('mousemove',e=>{if(drag){x=e.clientX;clip()}});addEventListener('touchmove',e=>{if(drag){x=e.touches[0].clientX;clip()}},{passive:false});addEventListener('mouseup',()=>drag=false);addEventListener('touchend',()=>drag=false);addEventListener('resize',()=>{x=Math.min(x,innerWidth);clip()});
})();
</script></body></html>

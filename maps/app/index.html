.sidebar{position:absolute;z-index:99;left:0;top:62px;bottom:0;width:var(--map-left);background:var(--panel);border-right:1px solid var(--line);overflow:auto}.side-tabs{display:flex;border-bottom:1px solid var(--line)}.side-tab{flex:1;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);padding:15px 8px 12px;font-weight:800;font-size:11px;letter-spacing:.1em;cursor:pointer}.side-tab.active{color:#f0f7f1;border-bottom-color:#51b978}.side-pane{padding:20px 18px}.side-pane.hidden{display:none}.section{margin:0 0 10px;color:#91a79a;font-size:10px;letter-spacing:.15em;font-weight:800}.layer-list{display:grid;gap:5px;margin-bottom:25px}.layer-btn{width:100%;border:1px solid transparent;border-radius:6px;background:transparent;color:#dbe8de;text-align:left;padding:10px 11px;cursor:pointer;font-weight:700}.layer-btn:hover{background:#21352a}.layer-btn.active{background:var(--green);border-color:#47b277;color:#fff}.layer-btn .swatch{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:9px;background:#668c73}.layer-btn.base .swatch{background:#b1c5b7}.layer-btn:disabled{opacity:.35;cursor:default}.side-action{width:100%;border:1px solid #45614f;border-radius:6px;background:#203629;color:#eef7f0;padding:10px;text-align:left;font-weight:800;cursor:pointer}.side-note{margin-top:25px;color:#829388;font-size:11px;line-height:1.45}.legend-title{font-size:18px;font-weight:800;margin-bottom:5px}.legend-sub{font-size:12px;color:var(--muted);line-height:1.4}.legend-gradient{height:15px;border-radius:4px;margin:25px 0 5px;background:linear-gradient(90deg,rgb(165,0,38),rgb(215,48,39),rgb(244,109,67),rgb(254,224,139),rgb(217,239,139),rgb(102,189,99),rgb(26,152,80),rgb(0,104,55))}.legend-gradient.elevation{background:linear-gradient(90deg,rgb(98,37,168),rgb(37,75,190),rgb(24,178,214),rgb(42,166,92),rgb(244,220,43),rgb(241,126,32),rgb(190,30,45))}.legend-scale{display:flex;justify-content:space-between;color:#a9b8ad;font-size:10px}

</style></head>
<body class="maps-app"><div id="app"><div id="map"></div><header class="topbar"><div class="brand"><b>Southern Skies</b> Agritech</div><div class="viewer-title">MAP VIEWER</div><div class="context"><strong id="paddockName">Loading…</strong><span id="propertyName"></span></div><input class="search" placeholder="Search paddocks" aria-label="Search paddocks"><button id="back" type="button">Back</button></header><aside class="sidebar"><nav class="side-tabs"><button class="side-tab active" data-tab="layers">LAYERS</button><button class="side-tab" data-tab="legend">LEGEND</button></nav><section id="layersPane" class="side-pane"><h2 class="section">BASE LAYERS</h2><div class="layer-list" role="radiogroup" aria-label="Base layers"><button class="layer-btn base" data-layer="satellite" role="radio" aria-checked="false"><span class="swatch"></span>Satellite</button><button class="layer-btn base" data-layer="map" role="radio" aria-checked="false"><span class="swatch"></span>Map</button></div><h2 class="section">SURVEY LAYERS</h2><div id="surveyLayers" class="layer-list"></div><h2 class="section">TOOLS</h2><button id="tools" class="side-action">⌁ &nbsp; Open measurement tools</button><p class="side-note">Choose one base map. Survey imagery is an optional overlay above it.</p></section><section id="legendPane" class="side-pane hidden"><div id="legendContent"></div></section></aside><section id="timeline" class="timeline" hidden><div id="selectedDate" class="selected-date">Survey date: <strong></strong></div><div class="timeline-row"><button id="previous" class="timeline-arrow" aria-label="Previous survey">‹</button><div id="dateTrack" class="date-track"></div><button id="next" class="timeline-arrow" aria-label="Next survey">›</button></div><div class="history-actions"><label for="compareDate">Compare with</label><select id="compareDate"></select><button id="compare" class="compare-btn" type="button">Open Compare</button></div></section></div>
<script src="/maps/config.js"></script><script src="https://unpkg.com/maplibre-gl@5.7.3/dist/maplibre-gl.js"></script><script src="/maps/ui/ssa-ui.js?v=7.0.8"></script>
<script>
(async()=>{const q=new URLSearchParams(location.search),property=q.get('property')||q.get('client'),paddock=q.get('paddock'),dateQ=q.get('date'),fail=e=>{document.getElementById('paddockName').textContent='Map unavailable';document.getElementById('propertyName').textContent=e.message};try{if(!property||!paddock)throw Error('Provide property and paddock in the URL.');const data=await fetch(`/portal/${encodeURIComponent(property)}/property.json`).then(r=>{if(!r.ok)throw Error('Property metadata could not be loaded.');return r.json()}),p=data.paddocks.find(x=>x.id===paddock);if(!p)throw Error('Paddock not found.');const surveys=[...p.surveys].sort((a,b)=>a.date.localeCompare(b.date));if(!surveys.length)throw Error('No surveys are available for this paddock.');let survey=surveys.find(s=>s.date===dateQ)||surveys[surveys.length-1],current=survey.layers.rgb?'rgb':Object.keys(survey.layers)[0],baseMode='satellite',ui;document.title=`${p.name} - ${data.name}`;paddockName.textContent=p.name;propertyName.textContent=data.name;
const key=window.SSA_CONFIG?.ESRI_API_KEY||'';let style={version:8,sources:{},layers:[]},esri=[];try{const r=await fetch(`https://basemapstyles-api.arcgis.com/arcgis/rest/services/styles/v2/styles/arcgis/imagery/standard?token=${encodeURIComponent(key)}`);if(r.ok)style=await r.json()}catch(e){}style.sources=style.sources||{};style.layers=style.layers||[];esri=style.layers.map(x=>x.id);style.sources.ssa_osm={type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256};style.layers.unshift({id:'ssa-osm',type:'raster',source:'ssa_osm',layout:{visibility:'none'}});const map=new maplibregl.Map({container:'map',style,center:survey.center,zoom:16});map.addControl(new maplibregl.NavigationControl(),'top-right');
function rasterSpec(L){return{type:'raster',tiles:[L.tiles],tileSize:256,minzoom:L.minzoom||14,maxzoom:L.maxzoom||20,scheme:L.scheme||'tms',bounds:[survey.bounds[0][0],survey.bounds[0][1],survey.bounds[1][0],survey.bounds[1][1]]}}function removeRaster(sourceId,layerId){if(map.getLayer(layerId))map.removeLayer(layerId);if(map.getSource(sourceId))map.removeSource(sourceId)}function addRaster(sourceId,layerId,L,opacity){map.addSource(sourceId,rasterSpec(L));map.addLayer({id:layerId,type:'raster',source:sourceId,paint:{'raster-opacity':opacity}})}function setBaseMode(mode){baseMode=mode==='map'?'map':'satellite';if(map.getLayer('ssa-osm'))map.setLayoutProperty('ssa-osm','visibility',baseMode==='map'?'visible':'none');esri.forEach(id=>{if(map.getLayer(id))map.setLayoutProperty(id,'visibility',baseMode==='satellite'?'visible':'none')});['survey-rgb-underlay','survey'].forEach(id=>{if(map.getLayer(id))map.setLayoutProperty(id,'visibility',current?'visible':'none')});updateLayers();renderLegend();if(ui)ui.legendFor(current||baseMode,false)}function renderLayer(id){const L=survey.layers[id];if(!L)return;removeRaster('survey','survey');removeRaster('survey-rgb-underlay-source','survey-rgb-underlay');if(id==='hillshade'&&survey.layers.rgb)addRaster('survey-rgb-underlay-source','survey-rgb-underlay',survey.layers.rgb,1);addRaster('survey','survey',L,L.opacity??1);current=id;setBaseMode(baseMode);renderLegend();if(ui)ui.legendFor(id,true)}function showLayer(id){if(current===id){current=null;['survey-rgb-underlay','survey'].forEach(layerId=>{if(map.getLayer(layerId))map.setLayoutProperty(layerId,'visibility','none')});updateLayers();renderLegend();if(ui)ui.legendFor(baseMode,false);return}renderLayer(id)}function updateLayers(){document.querySelectorAll('[data-layer].base').forEach(b=>{b.classList.toggle('active',b.dataset.layer===baseMode);b.setAttribute('aria-checked',String(b.dataset.layer===baseMode))});document.querySelectorAll('#surveyLayers [data-layer]').forEach(b=>b.classList.toggle('active',current===b.dataset.layer))}
function renderLegend(){const c=document.getElementById('legendContent');if(!current){c.innerHTML=`<div class="legend-title">${baseMode==='map'?'Map':'Satellite'}</div><p class="legend-sub">Base map selected. Choose a survey layer to add it above the base map.</p>`;return}const L=survey.layers[current]||{},info={rgb:['RGB','True-colour survey imagery.'],ndvi:['NDVI','Relative vegetation vigour and biomass.'],gndvi:['GNDVI','Green chlorophyll and canopy response.'],hillshade:['Hillshade','Colourised elevation relief over RGB imagery.']}[current]||[current.toUpperCase(),'Survey layer'],elevation=current==='hillshade',hasScale=current==='ndvi'||current==='gndvi'||elevation,low=elevation&&L.range?`${Math.round(L.range[0])} ${L.units||''}`:'Lower',high=elevation&&L.range?`${Math.round(L.range[1])} ${L.units||''}`:'Higher';c.innerHTML=`<div class="legend-title">${info[0]}</div><p class="legend-sub">${info[1]}</p>${hasScale?`<div class="legend-gradient${elevation?' elevation':''}"></div><div class="legend-scale"><span>${low}</span><span>${high}</span></div>`:''}`}
function buildLayers(){const holder=document.getElementById('surveyLayers');holder.replaceChildren();['rgb','ndvi','gndvi','hillshade'].forEach(id=>{const b=document.createElement('button');b.className='layer-btn';b.dataset.layer=id;b.disabled=!survey.layers[id];b.innerHTML=`<span class="swatch"></span>${survey.layers[id]?.label||id.toUpperCase()}`;b.onclick=()=>showLayer(id);holder.appendChild(b)});document.querySelectorAll('[data-layer].base').forEach(b=>b.onclick=()=>setBaseMode(b.dataset.layer));updateLayers()}
function renderTimeline(){const timeline=document.getElementById('timeline');timeline.hidden=false;const track=document.getElementById('dateTrack'),select=document.getElementById('compareDate');track.replaceChildren();select.replaceChildren();document.querySelector('#selectedDate strong').textContent=survey.dateLabel;surveys.forEach(s=>{const b=document.createElement('button');b.className='date-node';b.dataset.date=s.date;b.innerHTML=`<span class="active-label">${s.date===survey.date?'ACTIVE':''}</span><span class="dot"></span><span class="date-label">${s.dateLabel}</span>`;b.onclick=()=>selectSurvey(s.date);track.appendChild(b);const o=document.createElement('option');o.value=s.date;o.textContent=s.dateLabel;if(s.date===survey.date)o.disabled=true;select.appendChild(o)});const index=surveys.findIndex(s=>s.date===survey.date);previous.disabled=index<=0;next.disabled=index===surveys.length-1;track.querySelector(`[data-date="${survey.date}"]`)?.classList.add('active');select.value=surveys.find(s=>s.date!==survey.date)?.date||survey.date}
function selectSurvey(date){const nextSurvey=surveys.find(s=>s.date===date);if(!nextSurvey)return;survey=nextSurvey;current=survey.layers[current]?current:(survey.layers.rgb?'rgb':null);if(current)renderLayer(current);else{if(map.getLayer('survey'))map.setLayoutProperty('survey','visibility','none');updateLayers();renderLegend()}map.fitBounds(survey.bounds,{padding:50,maxZoom:19});buildLayers();renderTimeline()}
function openCompare(){const other=document.getElementById('compareDate').value;if(!other||other===survey.date)return;const layer=survey.layers[current]?current:'rgb';location.href=`/maps/compare/?client=${encodeURIComponent(property)}&paddock=${encodeURIComponent(p.id)}&left=${encodeURIComponent(survey.date)}&right=${encodeURIComponent(other)}&layer=${encodeURIComponent(layer)}`}
document.getElementById('back').onclick=()=>location.href=`/portal/${encodeURIComponent(property)}/${encodeURIComponent(p.id)}/`;document.getElementById('compare').onclick=openCompare;document.getElementById('tools').onclick=()=>ui?.openTools();document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('layersPane').classList.toggle('hidden',b.dataset.tab!=='layers');document.getElementById('legendPane').classList.toggle('hidden',b.dataset.tab!=='legend')});document.getElementById('previous').onclick=()=>{const i=surveys.findIndex(s=>s.date===survey.date);if(i>0)selectSurvey(surveys[i-1].date)};document.getElementById('next').onclick=()=>{const i=surveys.findIndex(s=>s.date===survey.date);if(i<surveys.length-1)selectSurvey(surveys[i+1].date)};
map.on('load',()=>{renderLayer(current);buildLayers();renderTimeline();map.fitBounds(survey.bounds,{padding:50,maxZoom:19});ui=new SSAUI({map,layers:Object.entries(survey.layers).map(([id,L])=>({id,label:L.label})),currentLayer:()=>current,setLayer:showLayer,setBase:mode=>setBaseMode(mode?'satellite':'map'),fit:()=>map.fitBounds(survey.bounds,{padding:50,maxZoom:19}),back:()=>location.href=`/portal/${encodeURIComponent(property)}/${encodeURIComponent(p.id)}/`,fileNameBase:`${data.name}-${p.name}`.replace(/\s+/g,'-')});ui.legendFor(current,true);renderLegend()})}catch(e){fail(e)}})();
</script></body></html>

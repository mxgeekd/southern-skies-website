<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Southern Skies Map App</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.7.3/dist/maplibre-gl.css">
<link rel="stylesheet" href="/maps/ui/ssa-ui.css?v=7.0.6">
<style>
html,body,#map{margin:0;width:100%;height:100%;overflow:hidden}#map{position:absolute;inset:0}
.app-head{position:absolute;z-index:94;top:10px;left:64px;background:#fffffff5;border:1px solid #d8e1db;border-radius:10px;padding:9px 13px;box-shadow:0 3px 12px #0002;font:13px Arial;color:#172219}.app-head strong{display:block;font-size:16px}.app-head span{color:#56635a}.app-head button{margin-top:7px;border:1px solid #157a49;border-radius:7px;background:#157a49;color:#fff;padding:6px 9px;font-weight:800;cursor:pointer}.app-timeline{position:absolute;z-index:95;left:50%;bottom:0;transform:translateX(-50%);display:flex;align-items:center;gap:8px;max-width:calc(100vw - 12px);background:#fffffff5;border:1px solid #d8e1db;border-bottom:0;border-radius:10px 10px 0 0;padding:7px 9px;box-shadow:0 -2px 12px #0002;font:700 12px Arial;color:#172219}.app-timeline button{border:1px solid #cbd7cf;border-radius:7px;background:#f7faf8;padding:7px 9px;font-weight:800;cursor:pointer}.app-timeline button:disabled{opacity:.4;cursor:default}.app-dates{display:flex;gap:4px;overflow-x:auto;max-width:62vw}.app-date{white-space:nowrap;border:1px solid #cbd7cf;border-radius:7px;background:#fff;padding:7px 10px;cursor:pointer}.app-date.active{background:#157a49;color:#fff;border-color:#157a49}.app-date:focus-visible,.app-timeline button:focus-visible,.app-head button:focus-visible{outline:2px solid #00aeea;outline-offset:1px}
@media(max-width:760px){.app-head{left:56px;top:6px}.app-head strong{font-size:14px}.app-timeline{left:6px;right:6px;transform:none}.app-dates{max-width:55vw}}
</style></head>
<body><div id="map"></div><div class="app-head"><strong id="paddockName">Loading map…</strong><span id="propertyName"></span><button id="compare" type="button">Compare surveys</button></div><div id="terraStrip" class="ssa-terra-strip"></div><div id="timeline" class="app-timeline" hidden></div>
<script src="/maps/config.js"></script><script src="https://unpkg.com/maplibre-gl@5.7.3/dist/maplibre-gl.js"></script><script src="/maps/ui/ssa-ui.js?v=7.0.6"></script>
<script>
(async()=>{
 const q=new URLSearchParams(location.search),property=q.get('property')||q.get('client'),paddock=q.get('paddock'),dateQ=q.get('date');
 const fail=e=>{document.getElementById('paddockName').textContent='Map unavailable';document.getElementById('propertyName').textContent=e.message};
 try{
  if(!property||!paddock)throw Error('Provide property and paddock in the URL.');
  const data=await fetch(`/portal/${encodeURIComponent(property)}/property.json`).then(r=>{if(!r.ok)throw Error('Property metadata could not be loaded.');return r.json()});
  const p=data.paddocks.find(x=>x.id===paddock);if(!p)throw Error('Paddock not found.');
  const surveys=[...p.surveys].sort((a,b)=>a.date.localeCompare(b.date));if(!surveys.length)throw Error('No surveys are available for this paddock.');
  let survey=surveys.find(s=>s.date===dateQ)||surveys[surveys.length-1],current=survey.layers.rgb?'rgb':Object.keys(survey.layers)[0],baseMode='imagery',ui;
  document.title=`${p.name} - ${data.name}`;document.getElementById('paddockName').textContent=p.name;document.getElementById('propertyName').textContent=data.name;
  const key=window.SSA_CONFIG?.ESRI_API_KEY||'';let style={version:8,sources:{},layers:[]},esri=[];
  try{const r=await fetch(`https://basemapstyles-api.arcgis.com/arcgis/rest/services/styles/v2/styles/arcgis/imagery/standard?token=${encodeURIComponent(key)}`);if(r.ok)style=await r.json()}catch(e){}
  style.sources=style.sources||{};style.layers=style.layers||[];esri=style.layers.map(x=>x.id);style.sources.ssa_osm={type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256};style.layers.unshift({id:'ssa-osm',type:'raster',source:'ssa_osm',layout:{visibility:'none'}});
  const map=new maplibregl.Map({container:'map',style,center:survey.center,zoom:16});map.addControl(new maplibregl.NavigationControl(),'top-right');
  function setBaseMode(mode){if(map.getLayer('ssa-osm'))map.setLayoutProperty('ssa-osm','visibility',mode==='map'?'visible':'none');esri.forEach(id=>{if(map.getLayer(id))map.setLayoutProperty(id,'visibility',mode==='satellite'?'visible':'none')});if(map.getLayer('survey'))map.setLayoutProperty('survey','visibility',mode==='imagery'?'visible':'none');baseMode=mode;updateLayers();if(ui)ui.legendFor(mode,false)}
  function showLayer(id){const L=survey.layers[id];if(!L)return; if(map.getLayer('survey'))map.removeLayer('survey');if(map.getSource('survey'))map.removeSource('survey');map.addSource('survey',{type:'raster',tiles:[L.tiles],tileSize:256,minzoom:L.minzoom||14,maxzoom:L.maxzoom||20,scheme:L.scheme||'tms',bounds:[survey.bounds[0][0],survey.bounds[0][1],survey.bounds[1][0],survey.bounds[1][1]]});map.addLayer({id:'survey',type:'raster',source:'survey'});current=id;setBaseMode('imagery');if(ui)ui.legendFor(id,true)}
  function choices(){return [{id:'map',label:'Map',base:true},{id:'satellite',label:'Satellite',base:true},{id:'rgb',label:'RGB'},{id:'ndvi',label:'NDVI'},{id:'gndvi',label:'GNDVI'}]}
  function updateLayers(){document.querySelectorAll('#terraStrip button').forEach(b=>{const id=b.dataset.choice;b.classList.toggle('active',(id===baseMode)||(baseMode==='imagery'&&id===current))})}
  function buildLayers(){const strip=document.getElementById('terraStrip');strip.replaceChildren();choices().forEach(c=>{const b=document.createElement('button');b.textContent=c.label;b.dataset.choice=c.id;if(c.base)b.classList.add('base');b.onclick=()=>c.base?setBaseMode(c.id):showLayer(c.id);strip.appendChild(b)});updateLayers()}
  function renderTimeline(){const t=document.getElementById('timeline');t.hidden=false;t.replaceChildren();const prev=document.createElement('button'),next=document.createElement('button'),dates=document.createElement('div');prev.textContent='◀';next.textContent='▶';dates.className='app-dates';surveys.forEach(s=>{const b=document.createElement('button');b.className='app-date';b.textContent=s.dateLabel;b.dataset.date=s.date;b.onclick=()=>selectSurvey(s.date);dates.appendChild(b)});t.append(prev,dates,next);prev.onclick=()=>selectSurvey(surveys[Math.max(0,surveys.findIndex(s=>s.date===survey.date)-1)].date);next.onclick=()=>selectSurvey(surveys[Math.min(surveys.length-1,surveys.findIndex(s=>s.date===survey.date)+1)].date);t._update=()=>{dates.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.date===survey.date));prev.disabled=survey===surveys[0];next.disabled=survey===surveys[surveys.length-1]};t._update()}
  function selectSurvey(date){const next=surveys.find(s=>s.date===date);if(!next)return;survey=next;current=survey.layers[current]?current:(survey.layers.rgb?'rgb':Object.keys(survey.layers)[0]);if(baseMode==='imagery')showLayer(current);else setBaseMode(baseMode);map.fitBounds(survey.bounds,{padding:50,maxZoom:19});renderTimeline()}
  function openCompare(){const layer=survey.layers[current]?current:'rgb';const other=surveys.find(s=>s.date!==survey.date);location.href=`/maps/compare/?client=${encodeURIComponent(property)}&paddock=${encodeURIComponent(p.id)}&left=${encodeURIComponent(survey.date)}&right=${encodeURIComponent(other?.date||'__satellite__')}&layer=${encodeURIComponent(layer)}`}
  document.getElementById('compare').onclick=openCompare;
  map.on('load',()=>{showLayer(current);buildLayers();renderTimeline();map.fitBounds(survey.bounds,{padding:50,maxZoom:19});ui=new SSAUI({map,layers:Object.entries(survey.layers).map(([id,L])=>({id,label:L.label})),currentLayer:()=>current,setLayer:showLayer,setBase:mode=>setBaseMode(mode?'satellite':'map'),fit:()=>map.fitBounds(survey.bounds,{padding:50,maxZoom:19}),back:()=>location.href=`/portal/${encodeURIComponent(property)}/${encodeURIComponent(p.id)}/`,fileNameBase:`${data.name}-${p.name}`.replace(/\s+/g,'-'),swipe:openCompare});ui.legendFor(current,true)});
 }catch(e){fail(e)}
})();
</script></body></html>

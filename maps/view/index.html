<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Southern Skies Agritech - Map Viewer</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.7.3/dist/maplibre-gl.css"><link rel="stylesheet" href="/maps/explorer/explorer.css"><style>html,body,#map{margin:0;width:100%;height:100%;font-family:Arial,sans-serif}</style></head><body><div id="map"></div><script src="/maps/config.js"></script><script src="https://unpkg.com/maplibre-gl@5.7.3/dist/maplibre-gl.js"></script><script src="/maps/explorer/explorer.js"></script><script>(async function(){const q=new URLSearchParams(location.search),client=q.get('client'),pid=q.get('paddock'),date=q.get('date');const data=await fetch(`/portal/${client}/property.json`).then(r=>r.json()),p=data.paddocks.find(x=>x.id===pid),s=p.surveys.find(x=>x.date===date);const key=window.SSA_CONFIG?.ESRI_API_KEY||'';let style={version:8,sources:{},layers:[]},ids=[];try{const r=await fetch(`https://basemapstyles-api.arcgis.com/arcgis/rest/services/styles/v2/styles/arcgis/imagery/standard?token=${encodeURIComponent(key)}`);if(r.ok)style=await r.json()}catch(e){}style.sources=style.sources||{};style.layers=style.layers||[];ids=style.layers.map(l=>l.id);style.sources.ssa_osm={type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256};style.layers.unshift({id:'ssa-osm',type:'raster',source:'ssa_osm',layout:{visibility:'none'}});const map=new maplibregl.Map({container:'map',style,center:s.center,zoom:16});map.addControl(new maplibregl.NavigationControl(),'top-right');let current=Object.keys(s.layers)[0];function b4(){return [s.bounds[0][0],s.bounds[0][1],s.bounds[1][0],s.bounds[1][1]]}function show(k){if(map.getLayer('survey'))map.removeLayer('survey');if(map.getSource('survey'))map.removeSource('survey');const L=s.layers[k];map.addSource('survey',{type:'raster',tiles:[L.tiles],tileSize:256,minzoom:L.minzoom||14,maxzoom:L.maxzoom||20,scheme:L.scheme||'tms',bounds:b4()});map.addLayer({id:'survey',type:'raster',source:'survey'});current=k}function opacity(v){if(map.getLayer('survey'))map.setPaintProperty('survey','raster-opacity',v)}function base(which){const sat=which==='satellite';if(map.getLayer('ssa-osm'))map.setLayoutProperty('ssa-osm','visibility',sat?'none':'visible');ids.forEach(id=>map.getLayer(id)&&map.setLayoutProperty(id,'visibility',sat?'visible':'none'))}map.on('load',()=>{show(current);map.fitBounds(s.bounds,{padding:50,maxZoom:19});new SSAExplorerUI({map,layers:Object.entries(s.layers).map(([id,L])=>({id,label:L.label,active:id===current})),setLayer:show,setOpacity:opacity,setBasemap:base,fit:()=>map.fitBounds(s.bounds,{padding:50,maxZoom:19}),backUrl:`/portal/${client}/${pid}/`,swipe:p.surveys.length>1?()=>location.href=`/maps/compare/?client=${encodeURIComponent(client)}&paddock=${encodeURIComponent(pid)}&left=${encodeURIComponent(p.surveys[0].date)}&right=${encodeURIComponent(p.surveys[p.surveys.length-1].date)}&layer=${encodeURIComponent(current)}`:null,fileNameBase:`${data.name}-${p.name}-${s.date}`.replace(/\s+/g,'-')})})})();</script></body></html>

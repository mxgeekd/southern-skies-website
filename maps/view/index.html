<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Southern Skies Map</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.7.3/dist/maplibre-gl.css">
<link rel="stylesheet" href="/maps/ui/ssa-ui.css?v=7.0.2">
<style>html,body,#map{margin:0;width:100%;height:100%}</style></head>
<body><div id="map"></div>
<script src="/maps/config.js"></script>
<script src="https://unpkg.com/maplibre-gl@5.7.3/dist/maplibre-gl.js"></script>
<script src="/maps/ui/ssa-ui.js?v=7.0.2"></script>
<script>
(async()=>{
 const q=new URLSearchParams(location.search),client=q.get('client'),pid=q.get('paddock'),date=q.get('date');
 const data=await fetch(`/portal/${client}/property.json?b=7.0.2`).then(r=>r.json()),p=data.paddocks.find(x=>x.id===pid),s=p.surveys.find(x=>x.date===date);
 const key=window.SSA_CONFIG?.ESRI_API_KEY||'';let style={version:8,sources:{},layers:[]},esri=[];
 try{const r=await fetch(`https://basemapstyles-api.arcgis.com/arcgis/rest/services/styles/v2/styles/arcgis/imagery/standard?token=${encodeURIComponent(key)}`);if(r.ok)style=await r.json()}catch(e){}
 style.sources=style.sources||{};style.layers=style.layers||[];esri=style.layers.map(x=>x.id);style.sources.ssa_osm={type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256};style.layers.unshift({id:'ssa-osm',type:'raster',source:'ssa_osm',layout:{visibility:'none'}});
 const map=new maplibregl.Map({container:'map',style,center:s.center,zoom:16});map.addControl(new maplibregl.NavigationControl(),'top-right');let current=Object.keys(s.layers)[0],ui;
 function show(k){if(map.getLayer('survey'))map.removeLayer('survey');if(map.getSource('survey'))map.removeSource('survey');const L=s.layers[k];map.addSource('survey',{type:'raster',tiles:[L.tiles],tileSize:256,minzoom:L.minzoom||14,maxzoom:L.maxzoom||20,scheme:L.scheme||'tms',bounds:[s.bounds[0][0],s.bounds[0][1],s.bounds[1][0],s.bounds[1][1]]});map.addLayer({id:'survey',type:'raster',source:'survey'});current=k;setTimeout(()=>ui&&ui.maps.forEach(m=>ui.raise(m)),20)}
 function base(sat){if(map.getLayer('ssa-osm'))map.setLayoutProperty('ssa-osm','visibility',sat?'none':'visible');esri.forEach(id=>{if(map.getLayer(id))map.setLayoutProperty(id,'visibility',sat?'visible':'none')})}
 map.on('load',()=>{show(current);map.fitBounds(s.bounds,{padding:50,maxZoom:19});ui=new SSAUI({map,layers:Object.entries(s.layers).map(([id,L])=>({id,label:L.label})),currentLayer:()=>current,setLayer:show,setBase:base,fit:()=>map.fitBounds(s.bounds,{padding:50,maxZoom:19}),back:()=>location.href=`/portal/${client}/${pid}/`,fileNameBase:`${data.name}-${p.name}-${s.date}`.replace(/\s+/g,'-'),swipe:()=>{let right='__satellite__';if(p.surveys.length>1){const alt=p.surveys.find(x=>x.date!==s.date);if(alt)right=alt.date}location.href=`/maps/compare/?client=${encodeURIComponent(client)}&paddock=${encodeURIComponent(pid)}&left=${encodeURIComponent(s.date)}&right=${encodeURIComponent(right)}&layer=${encodeURIComponent(current)}`}})});
})();
</script></body></html>

<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Private Property Index - Southern Skies Agritech</title>
<style>
:root{--green:#168451;--ink:#e9f0eb;--muted:#9aa99f;--panel:#17231c;--line:#30443a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0f1712;color:var(--ink);font-family:Arial,sans-serif}.top{padding:28px 22px;background:#111b15;border-bottom:1px solid var(--line)}.wrap{width:min(880px,calc(100% - 32px));margin:auto}.brand{font-size:14px;font-weight:800;letter-spacing:.03em}.brand b{color:#56bf7e}.eyebrow{margin-top:22px;color:#91a79a;font-size:10px;font-weight:900;letter-spacing:.16em}.top h1{margin:6px 0 0;font-size:30px}.top p{margin:8px 0 0;color:var(--muted)}main{padding:28px 0 50px}.list{display:grid;gap:12px}.property{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px;border:1px solid var(--line);border-radius:11px;background:var(--panel);box-shadow:0 5px 18px #0003}.property h2{margin:0;font-size:18px}.property a{flex:0 0 auto;border:1px solid #5fc486;border-radius:7px;background:var(--green);color:#fff;padding:9px 12px;font-size:12px;font-weight:800;text-decoration:none}.property a:hover{background:#1d9860}.status{color:var(--muted);font-size:13px}.error{color:#ffd977}@media(max-width:560px){.top{padding:22px 8px}.top h1{font-size:25px}main{padding-top:18px}.property{align-items:flex-start;flex-direction:column}.property a{width:100%;text-align:center}}
</style></head>
<body><header class="top"><div class="wrap"><div class="brand"><b>Southern Skies</b> Agritech</div><div class="eyebrow">MAPPING PLATFORM</div><h1>Private Property Index</h1><p>Owner and administrator property navigation.</p></div></header>
<main class="wrap"><div id="status" class="status">Loading properties…</div><div id="properties" class="list" hidden></div></main>
<script>
(async()=>{const status=document.getElementById('status'),list=document.getElementById('properties');try{const response=await fetch('/portal/properties.json?b=7.0.19');if(!response.ok)throw Error('Property directory could not be loaded.');const data=await response.json(),properties=[...(data.properties||[])].sort((a,b)=>a.name.localeCompare(b.name));if(!properties.length){status.textContent='No properties are published.';return}properties.forEach(property=>{const card=document.createElement('article'),title=document.createElement('h2'),link=document.createElement('a');card.className='property';title.textContent=property.name;link.href=`/portal/${encodeURIComponent(property.id)}/map/`;link.textContent='Open property';link.setAttribute('aria-label',`Open ${property.name}`);card.append(title,link);list.appendChild(card)});status.hidden=true;list.hidden=false}catch(error){status.classList.add('error');status.textContent=error.message}})();
</script></body></html>

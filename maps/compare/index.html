<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Southern Skies Agritech - Compare</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.7.3/dist/maplibre-gl.css"><link rel="stylesheet" href="/maps/explorer/explorer.css"><style>html,body,#shell{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif}#shell{position:relative}.map{position:absolute;inset:0}.rw{position:absolute;inset:0;overflow:hidden;pointer-events:none}.handle{position:absolute;z-index:25;top:0;bottom:0;width:3px;background:#fff;box-shadow:0 0 0 1px #0004;cursor:ew-resize;touch-action:none}.knob{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 3px 12px #0004;font-size:20px}</style></head><body><div id="shell"><div id="lm" class="map"></div><div id="rw" class="rw"><div id="rm" class="map"></div></div><div id="handle" class="handle"><div class="knob">↔</div></div></div><script src="/maps/config.js"></script><script src="https://unpkg.com/maplibre-gl@5.7.3/dist/maplibre-gl.js"></script><script src="/maps/explorer/explorer.js"></script><script>(async function(){const q=new URLSearchParams(location.search),client=q.get('client'),pid=q.get('paddock'),leftQ=q.get('left'),rightQ=q.get('right'),layerQ=q.get('layer')||'ndvi';const data=await fetch(`/portal/${client}/property.json`).then(r=>r.json()),p=data.paddocks.find(x=>x.id===pid);let left=p.surveys.find(x=>x.date===leftQ)||p.surveys[0],right=p.surveys.find(x=>x.date===rightQ)||p.surveys[p.surveys.length-1],lk=left.layers[layerQ]?layerQ:Object.keys(left.layers)[0],rk=right.layers[layerQ]?layerQ:Object.keys(right.layers)[0];const key=window.SSA_CONFIG?.ESRI_API_KEY||'';let style={version:8,sources:{},layers:[]},ids=[];try{const r=await fetch(`https://basemapstyles-api.arcgis.com/arcgis/rest/services/styles/v2/styles/arcgis/imagery/standard?token=${encodeURIComponent(key)}`);if(r.ok)style=await r.json()}catch(e){}style.sources=style.sources||{};style.layers=style.layers||[];ids=style.layers.map(l=>l.id);style.sources.ssa_osm={type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256};style.layers.unshift({id:'ssa-osm',type:'raster',source:'ssa_osm',layout:{visibility:'none'}});const lm=new maplibregl.Map({container:'lm',style:JSON.parse(JSON.stringify(style)),center:left.center,zoom:16}),rm=new maplibregl.Map({container:'rm',style:JSON.parse(JSON.stringify(style)),center:left.center,zoom:16,interactive:false,attributionControl:false});lm.addControl(new maplibregl.NavigationControl(),'top-right');function b4(s){return[s.bounds[0][0],s.bounds[0][1],s.bounds[1][0],s.bounds[1][1]]}function add(m,src,id,s,k){if(m.getLayer(id))m.removeLayer(id);if(m.getSource(src))m.removeSource(src);const L=s.layers[k];m.addSource(src,{type:'raster',tiles:[L.tiles],tileSize:256,minzoom:L.minzoom||14,maxzoom:L.maxzoom||20,scheme:L.scheme||'tms',bounds:b4(s)});m.addLayer({id,type:'raster',source:src})}function refresh(){add(lm,'ls','li',left,lk);add(rm,'rs','ri',right,rk)}function sync(){const c=lm.getCenter();rm.jumpTo({center:[c.lng,c.lat],zoom:lm.getZoom(),bearing:lm.getBearing(),pitch:lm.getPitch()})}lm.on('move',sync);let x=innerWidth/2,drag=false;function clip(){x=Math.max(0,Math.min(x,innerWidth));handle.style.left=(x-1.5)+'px';rw.style.left=x+'px';rm.style.left=(-x)+'px';rm.style.width=innerWidth+'px';rm.style.height=innerHeight+'px';rm.resize();sync()}function base(which){const sat=which==='satellite';[lm,rm].forEach(m=>{if(m.getLayer('ssa-osm'))m.setLayoutProperty('ssa-osm','visibility',sat?'none':'visible');ids.forEach(id=>m.getLayer(id)&&m.setLayoutProperty(id,'visibility',sat?'visible':'none'))})}function op(v){if(lm.getLayer('li'))lm.setPaintProperty('li','raster-opacity',v);if(rm.getLayer('ri'))rm.setPaintProperty('ri','raster-opacity',v)}Promise.all([new Promise(r=>lm.on('load',r)),new Promise(r=>rm.on('load',r))]).then(()=>{refresh();lm.fitBounds(left.bounds,{padding:50,maxZoom:19});clip();new SSAExplorerUI({maps:[lm,rm],masterMap:lm,container:shell,layers:[{id:'rgb',label:'RGB',active:lk==='rgb'},{id:'ndvi',label:'NDVI',active:lk==='ndvi'},{id:'gndvi',label:'GNDVI',active:lk==='gndvi'}].filter(x=>left.layers[x.id]&&right.layers[x.id]),setLayer:k=>{lk=rk=k;refresh()},setOpacity:op,setBasemap:base,fit:()=>lm.fitBounds(left.bounds,{padding:50,maxZoom:19}),backUrl:`/portal/${client}/${pid}/`,swipe:()=>{},fileNameBase:`${data.name}-${p.name}-compare`.replace(/\s+/g,'-')})});handle.onmousedown=e=>{drag=true;e.preventDefault()};handle.ontouchstart=e=>{drag=true;e.preventDefault()};addEventListener('mousemove',e=>{if(drag){x=e.clientX;clip()}});addEventListener('touchmove',e=>{if(drag){x=e.touches[0].clientX;clip()}},{passive:false});addEventListener('mouseup',()=>drag=false);addEventListener('touchend',()=>drag=false);})();</script></body></html>

<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Southern Skies Compare</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.7.3/dist/maplibre-gl.css">
<link rel="stylesheet" href="/maps/ui/ssa-ui.css?v=7.0.3">
<style>html,body,#shell{margin:0;width:100%;height:100%;overflow:hidden}#shell{position:relative}.map{position:absolute;inset:0}.rw{position:absolute;inset:0;overflow:hidden;pointer-events:none}.handle{position:absolute;z-index:96;top:0;bottom:0;width:3px;background:#fff;box-shadow:0 0 0 1px #0004;cursor:ew-resize}.knob{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 3px 12px #0004}.dual{position:absolute;z-index:95;left:64px;bottom:58px;background:#fffffff4;border:1px solid #d8e1db;border-radius:10px;padding:7px;display:flex;gap:7px;font:12px Arial}.dual select{padding:7px;border:1px solid #cbd7cf;border-radius:7px;max-width:140px}</style></head>
<body><div id="shell"><div id="lm" class="map"></div><div id="rw" class="rw"><div id="rm" class="map"></div></div><div id="handle" class="handle"><div class="knob">↔</div></div></div>
<div class="dual"><b>L</b><select id="lsel"></select><b>R</b><select id="rsel"></select></div>
<script src="/maps/config.js"></script>
<script src="https://unpkg.com/maplibre-gl@5.7.3/dist/maplibre-gl.js"></script>
<script src="/maps/ui/ssa-ui.js?v=7.0.3"></script>
<script>
(async()=>{
 const q=new URLSearchParams(location.search),client=q.get('client'),pid=q.get('paddock'),leftQ=q.get('left'),rightQ=q.get('right'),layerQ=q.get('layer')||'rgb';
 const data=await fetch(`/portal/${client}/property.json?b=7.0.3`).then(r=>r.json()),p=data.paddocks.find(x=>x.id===pid);
 const SAT={date:'__satellite__',dateLabel:'Satellite',center:p.surveys[0]?.center||[152,-31],bounds:p.surveys[0]?.bounds||[[151,-32],[153,-30]],layers:{}};
 let left=p.surveys.find(x=>x.date===leftQ)||p.surveys[0],right=rightQ==='__satellite__'?SAT:(p.surveys.find(x=>x.date===rightQ)||SAT),lk=left.layers[layerQ]?layerQ:Object.keys(left.layers)[0],rk=right===SAT?'__satellite__':(right.layers[layerQ]?layerQ:Object.keys(right.layers)[0]);
 const key=window.SSA_CONFIG?.ESRI_API_KEY||'';let style={version:8,sources:{},layers:[]};try{const r=await fetch(`https://basemapstyles-api.arcgis.com/arcgis/rest/services/styles/v2/styles/arcgis/imagery/standard?token=${encodeURIComponent(key)}`);if(r.ok)style=await r.json()}catch(e){}
 const lmap=new maplibregl.Map({container:'lm',style:JSON.parse(JSON.stringify(style)),center:left.center,zoom:16}),rmap=new maplibregl.Map({container:'rm',style:JSON.parse(JSON.stringify(style)),center:left.center,zoom:16,interactive:false,attributionControl:false});lmap.addControl(new maplibregl.NavigationControl(),'top-right');let ui;
 function add(m,src,id,s,k){if(m.getLayer(id))m.removeLayer(id);if(m.getSource(src))m.removeSource(src);if(s===SAT||k==='__satellite__')return;const L=s.layers[k];m.addSource(src,{type:'raster',tiles:[L.tiles],tileSize:256,minzoom:L.minzoom||14,maxzoom:L.maxzoom||20,scheme:L.scheme||'tms',bounds:[s.bounds[0][0],s.bounds[0][1],s.bounds[1][0],s.bounds[1][1]]});m.addLayer({id,type:'raster',source:src})}
 function fill(sel,s,k){sel.innerHTML='';if(s===SAT){const o=document.createElement('option');o.value='__satellite__';o.textContent='Satellite';sel.appendChild(o);return'__satellite__'}Object.entries(s.layers).forEach(([id,L])=>{const o=document.createElement('option');o.value=id;o.textContent=L.label;sel.appendChild(o)});if(!s.layers[k])k=Object.keys(s.layers)[0];sel.value=k;return k}
 lk=fill(lsel,left,lk);rk=fill(rsel,right,rk);
 function refresh(){add(lmap,'ls','li',left,lk);add(rmap,'rs','ri',right,rk);setTimeout(()=>ui&&ui.maps.forEach(m=>ui.raise(m)),20)}
 function sync(){const c=lmap.getCenter();rmap.jumpTo({center:[c.lng,c.lat],zoom:lmap.getZoom(),bearing:lmap.getBearing(),pitch:lmap.getPitch()})}lmap.on('move',sync);
 let x=innerWidth/2,drag=false;function clip(){x=Math.max(0,Math.min(x,innerWidth));handle.style.left=(x-1.5)+'px';rw.style.left=x+'px';rm.style.left=(-x)+'px';rm.style.width=innerWidth+'px';rm.style.height=innerHeight+'px';rmap.resize();sync()}
 Promise.all([new Promise(r=>lmap.on('load',r)),new Promise(r=>rmap.on('load',r))]).then(()=>{refresh();lmap.fitBounds(left.bounds,{padding:50,maxZoom:19});clip();const layers=[...new Map(p.surveys.flatMap(s=>Object.entries(s.layers).map(([id,L])=>[id,{id,label:L.label}]))).values()];ui=new SSAUI({maps:[lmap,rmap],masterMap:lmap,container:shell,layers,currentLayer:()=>lk,setLayer:k=>{if(left.layers[k]){lk=k;lsel.value=k;refresh()}},fit:()=>lmap.fitBounds(left.bounds,{padding:50,maxZoom:19}),back:()=>location.href=`/portal/${client}/${pid}/`,fileNameBase:`${data.name}-${p.name}-compare`.replace(/\s+/g,'-')})});
 lsel.onchange=()=>{lk=lsel.value;refresh();ui&&ui.legendFor(lk,true)};rsel.onchange=()=>{rk=rsel.value;refresh();ui&&ui.legendFor(rk,true)};
 handle.onmousedown=e=>{drag=true;e.preventDefault()};addEventListener('mousemove',e=>{if(drag){x=e.clientX;clip()}});addEventListener('mouseup',()=>drag=false);
})();
</script></body></html>

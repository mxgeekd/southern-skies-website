<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Field Area Estimator | Souther Skies Agritech</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }

    .controls {
      padding: 16px;
      background: #111827;
      border-bottom: 1px solid #334155;
    }

    .controls h1 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .area-box {
      margin: 10px 0;
      font-size: 18px;
    }

    #area-display {
      font-weight: bold;
      color: #38bdf8;
    }

    .help-text {
      margin: 8px 0 12px;
      color: #cbd5e1;
      font-size: 14px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #1d4ed8;
    }

    #map {
      height: calc(100vh - 145px);
      width: 100%;
    }
  </style>
</head>

<body>
  <div class="controls">
    <h1>Field Area Estimator</h1>

    <div class="area-box">
      Field Area: <span id="area-display">0.0000</span> hectares
    </div>

    <p class="help-text">
      Click the map to place boundary markers. After three points, new markers are inserted into the nearest boundary line.
      Drag markers to reshape the field. Drag the shaded polygon to move the whole field. Click a marker to delete it.
    </p>

    <button onclick="clearField()">Clear Field</button>
  </div>

  <div id="map"></div>

  <script>
    let map;
    let polygon;
    let markers = [];

    function initMap() {
      map = new google.maps.Map(document.getElementById("map"), {
        zoom: 16,
        center: { lat: -37.5622, lng: 143.8503 },
        mapTypeId: "satellite",
        streetViewControl: false,
        mapTypeControl: true,
        fullscreenControl: true,
      });

      polygon = new google.maps.Polygon({
        paths: [],
        strokeColor: "#38bdf8",
        strokeOpacity: 0.95,
        strokeWeight: 3,
        fillColor: "#38bdf8",
        fillOpacity: 0.25,
        draggable: true,
        map: map,
      });

      map.addListener("click", (event) => {
        addMarkerSmart(event.latLng);
      });

      polygon.addListener("dragend", () => {
        syncMarkersToPolygon();
        updateArea();
      });
    }

    function makeMarker(position, number) {
      const marker = new google.maps.Marker({
        position,
        map,
        draggable: true,
        label: {
          text: String(number),
          color: "#ffffff",
          fontWeight: "bold",
          fontSize: "13px",
        },
        icon: {
          path: google.maps.SymbolPath.CIRCLE,
          scale: 13,
          fillColor: "#2563eb",
          fillOpacity: 1,
          strokeColor: "#ffffff",
          strokeWeight: 2,
        },
        title: "Click to delete this boundary marker",
      });

      marker.addListener("drag", () => {
        redrawPolygon();
      });

      marker.addListener("click", () => {
        marker.setMap(null);
        markers = markers.filter((m) => m !== marker);
        refreshMarkerNumbers();
        redrawPolygon();
      });

      return marker;
    }

    function addMarkerSmart(position) {
      const marker = makeMarker(position, markers.length + 1);

      if (markers.length < 3) {
        markers.push(marker);
      } else {
        const insertIndex = findNearestSegmentInsertIndex(position);
        markers.splice(insertIndex, 0, marker);
      }

      refreshMarkerNumbers();
      redrawPolygon();
    }

    function findNearestSegmentInsertIndex(position) {
      let closestIndex = markers.length;
      let closestDistance = Infinity;

      for (let i = 0; i < markers.length; i++) {
        const start = markers[i].getPosition();
        const end = markers[(i + 1) % markers.length].getPosition();

        const distance = google.maps.geometry.spherical.computeDistanceBetween(
          position,
          closestPointOnSegment(position, start, end)
        );

        if (distance < closestDistance) {
          closestDistance = distance;
          closestIndex = i + 1;
        }
      }

      return closestIndex;
    }

    function closestPointOnSegment(point, start, end) {
      const p = { x: point.lng(), y: point.lat() };
      const a = { x: start.lng(), y: start.lat() };
      const b = { x: end.lng(), y: end.lat() };

      const dx = b.x - a.x;
      const dy = b.y - a.y;

      if (dx === 0 && dy === 0) return start;

      let t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / (dx * dx + dy * dy);
      t = Math.max(0, Math.min(1, t));

      return new google.maps.LatLng(
        a.y + t * dy,
        a.x + t * dx
      );
    }

    function redrawPolygon() {
      const path = markers.map((marker) => marker.getPosition());
      polygon.setPath(path);
      updateArea();
    }

    function syncMarkersToPolygon() {
      const path = polygon.getPath();

      path.forEach((latLng, index) => {
        if (markers[index]) {
          markers[index].setPosition(latLng);
        }
      });
    }

    function refreshMarkerNumbers() {
      markers.forEach((marker, index) => {
        marker.setLabel({
          text: String(index + 1),
          color: "#ffffff",
          fontWeight: "bold",
          fontSize: "13px",
        });
      });
    }

    function updateArea() {
      const path = polygon.getPath();

      if (path.getLength() < 3) {
        document.getElementById("area-display").innerText = "0.0000";
        return;
      }

      const areaInSquareMeters = google.maps.geometry.spherical.computeArea(path);
      const areaInHectares = areaInSquareMeters / 10000;

      document.getElementById("area-display").innerText = areaInHectares.toFixed(4);
    }

    function clearField() {
      markers.forEach((marker) => marker.setMap(null));
      markers = [];
      polygon.setPath([]);
      updateArea();
    }
  </script>

  <script
    async
    defer
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCFSDw9prrF19Qju9zWUuQoFyos-s-DADo&libraries=geometry&callback=initMap">
  </script>
</body>
</html>

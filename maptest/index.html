<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Southern Skies Agritech — Field Viewer</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@5.7.3/dist/maplibre-gl.css"
  >

  <style>
    :root {
      --panel: rgba(255,255,255,.97);
      --ink: #172019;
      --muted: #607065;
      --green: #1f6f43;
      --green-dark: #155432;
      --border: #dbe4dd;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: var(--ink);
    }

    #map {
      position: absolute;
      inset: 0;
    }

    .panel {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 5;
      width: min(360px, calc(100vw - 28px));
      max-height: calc(100vh - 28px);
      overflow: auto;
      background: var(--panel);
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,.24);
      padding: 16px;
      box-sizing: border-box;
      border: 1px solid rgba(0,0,0,.06);
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--green);
      font-weight: 700;
      margin-bottom: 5px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
    }

    .meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .section {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: #344239;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .layer-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    .basemap-tabs {
      grid-template-columns: repeat(2, 1fr);
    }

    .layer-btn {
      appearance: none;
      border: 1px solid #cfd9d2;
      background: #f7faf8;
      color: #27332b;
      padding: 9px 8px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    .layer-btn.active {
      background: var(--green);
      color: #fff;
      border-color: var(--green);
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
    }

    .row label {
      min-width: 58px;
      font-size: 13px;
      font-weight: 700;
    }

    .row input[type="range"] {
      flex: 1;
    }

    .row output {
      width: 38px;
      text-align: right;
      font-size: 12px;
      color: var(--muted);
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    button.action {
      border: 0;
      border-radius: 8px;
      padding: 9px 11px;
      background: var(--green);
      color: white;
      cursor: pointer;
      font-weight: 700;
    }

    button.action:hover {
      background: var(--green-dark);
    }

    .legend {
      display: none;
      margin-top: 14px;
    }

    .legend.visible {
      display: block;
    }

    .legend-title {
      font-size: 13px;
      font-weight: 700;
    }

    .legend-subtitle {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .gradient {
      height: 15px;
      border-radius: 999px;
      margin-top: 8px;
      border: 1px solid rgba(0,0,0,.1);
      background: linear-gradient(
        90deg,
        rgb(165,0,38) 0%,
        rgb(215,48,39) 20%,
        rgb(244,109,67) 50%,
        rgb(254,224,139) 65%,
        rgb(217,239,139) 75%,
        rgb(102,189,99) 85%,
        rgb(0,104,55) 100%
      );
    }

    .legend-scale {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--muted);
      margin-top: 4px;
    }

    .legend-notes {
      margin-top: 8px;
      display: grid;
      gap: 3px;
    }

    .legend-note {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 11px;
      color: #46544b;
    }

    .status {
      margin-top: 12px;
      font-size: 11px;
      line-height: 1.45;
      color: var(--muted);
    }

    .maplibregl-ctrl-attrib {
      font-size: 10px;
    }

    @media (max-width: 650px) {
      .panel {
        top: 8px;
        left: 8px;
        width: calc(100vw - 16px);
        padding: 13px;
      }

      h1 {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <div class="panel">

    <div class="eyebrow">Southern Skies Agritech</div>

    <h1 id="title">Loading survey...</h1>

    <div class="meta" id="meta"></div>


    <div class="section">

      <div class="section-title">Basemap</div>

      <div class="layer-tabs basemap-tabs">

        <button
          class="layer-btn active"
          id="mapBasemapBtn"
          type="button">
          Map
        </button>

        <button
          class="layer-btn"
          id="satelliteBasemapBtn"
          type="button">
          Satellite
        </button>

      </div>

    </div>


    <div class="section">

      <div class="section-title">Imagery</div>

      <div
        class="layer-tabs"
        id="layerTabs">
      </div>

      <div class="row">

        <label for="opacity">Opacity</label>

        <input
          id="opacity"
          type="range"
          min="0"
          max="100"
          value="100"
        >

        <output id="opacityValue">100%</output>

      </div>

      <div class="actions">

        <button
          class="action"
          id="fitBtn"
          type="button">
          Fit survey
        </button>

      </div>

      <div class="legend" id="legend">

        <div
          class="legend-title"
          id="legendTitle">
        </div>

        <div
          class="legend-subtitle"
          id="legendSubtitle">
        </div>

        <div class="gradient"></div>

        <div class="legend-scale">
          <span>-1.0</span>
          <span>0</span>
          <span>0.5</span>
          <span>1.0</span>
        </div>

        <div
          class="legend-notes"
          id="legendNotes">
        </div>

      </div>

      <div
        class="status"
        id="status">
        Loading map...
      </div>

    </div>

  </div>


  <script src="https://unpkg.com/maplibre-gl@5.7.3/dist/maplibre-gl.js"></script>

  <script>
    (async function () {

      /*
       * Paste the ArcGIS token ONLY between the quotes.
       */
      const ESRI_API_KEY = 'AAPTagPaE_90QGccsyzPLnRE4Cg..TvuUowd1TLpfnMBY81AHr82_9fY59SLQRn83OCQYB7I2KR7Ol1ZFgX-4-FArM1-ZhG9XLxQ87w-7NPCjch6dl2wObSko4Yz2A0uqBbL_p_kzZ-dVw9BVx4tYoC9ZmGnYwIm_3GJuFVszijxgo_-yXWzuHaqJweNucXYceuC2gg4UVt2CDwJ5GGbAlCRI8d9xdEdIdhqPa9Aggs3AIdd_62oyvNjkROBYcEit02g7f90eJ6DRjWJpsA..AT1_6PqmzSJc';

      const status = document.getElementById('status');

      let survey;


      /*
       * Load survey.json
       */
      try {

        const response = await fetch(
          './survey.json',
          { cache: 'no-store' }
        );

        if (!response.ok) {
          throw new Error(
            'survey.json returned HTTP ' + response.status
          );
        }

        survey = await response.json();

      } catch (error) {

        console.error(error);

        status.textContent =
          'Could not load survey.json: ' + error.message;

        return;
      }


      /*
       * Survey heading
       */
      document.getElementById('title').textContent =
        survey.property;

      document.getElementById('meta').textContent =
        survey.paddock + ' · ' + survey.dateLabel;


      /*
       * Build ArcGIS tile URL using normal string concatenation.
       *
       * No backticks.
       * No ${...}.
       */
      const esriTileURL =
        'https://static-map-tiles-api.arcgis.com/' +
        'arcgis/rest/services/' +
        'static-basemap-tiles-service/v1/' +
        'arcgis/imagery/static/tile/' +
        '{z}/{y}/{x}' +
        '?token=' +
        encodeURIComponent(ESRI_API_KEY);


      /*
       * Create MapLibre map
       */
      const map = new maplibregl.Map({

        container: 'map',

        center: survey.center,

        zoom: 16,

        attributionControl: true,

        style: {

          version: 8,

          sources: {

            osm: {

              type: 'raster',

              tiles: [
                'https://tile.openstreetmap.org/{z}/{x}/{y}.png'
              ],

              tileSize: 256,

              maxzoom: 19,

              attribution:
                '© OpenStreetMap contributors'
            },


            esriSatellite: {

              type: 'raster',

              tiles: [
                esriTileURL
              ],

              tileSize: 512,

              maxzoom: 23,

              attribution:
                'Esri'
            }

          },

          layers: [

            {
              id: 'osm',
              type: 'raster',
              source: 'osm',

              layout: {
                visibility: 'visible'
              }
            },

            {
              id: 'esri-satellite',
              type: 'raster',
              source: 'esriSatellite',

              layout: {
                visibility: 'none'
              }
            }

          ]

        }

      });


      /*
       * Standard map controls
       */
      map.addControl(
        new maplibregl.NavigationControl(),
        'top-right'
      );

      map.addControl(
        new maplibregl.FullscreenControl(),
        'top-right'
      );


      /*
       * Basemap controls
       */
      const mapBasemapBtn =
        document.getElementById('mapBasemapBtn');

      const satelliteBasemapBtn =
        document.getElementById('satelliteBasemapBtn');


      function setBasemap(type) {

        const satellite =
          type === 'satellite';

        if (map.getLayer('osm')) {

          map.setLayoutProperty(
            'osm',
            'visibility',
            satellite ? 'none' : 'visible'
          );

        }

        if (map.getLayer('esri-satellite')) {

          map.setLayoutProperty(
            'esri-satellite',
            'visibility',
            satellite ? 'visible' : 'none'
          );

        }

        mapBasemapBtn.classList.toggle(
          'active',
          !satellite
        );

        satelliteBasemapBtn.classList.toggle(
          'active',
          satellite
        );

        status.textContent =
          satellite
            ? 'Satellite basemap enabled.'
            : 'Map basemap enabled.';
      }


      mapBasemapBtn.addEventListener(
        'click',
        function () {
          setBasemap('map');
        }
      );

      satelliteBasemapBtn.addEventListener(
        'click',
        function () {
          setBasemap('satellite');
        }
      );


      /*
       * Survey imagery
       */
      let activeKey = 'rgb';


      function fitSurvey() {

        map.fitBounds(
          survey.bounds,
          {
            padding: 60,
            maxZoom: 19
          }
        );

      }


      function setLegend(layer) {

        const legend =
          document.getElementById('legend');

        if (!layer.legend) {

          legend.classList.remove('visible');

          return;
        }

        document.getElementById(
          'legendTitle'
        ).textContent =
          layer.legend.title || layer.label;

        document.getElementById(
          'legendSubtitle'
        ).textContent =
          layer.legend.subtitle || '';

        const notes =
          document.getElementById('legendNotes');

        notes.innerHTML = '';

        (layer.legend.ticks || []).forEach(
          function (tick) {

            const row =
              document.createElement('div');

            row.className =
              'legend-note';

            const label =
              document.createElement('span');

            label.textContent =
              tick.label;

            const value =
              document.createElement('strong');

            value.textContent =
              tick.value;

            row.appendChild(label);
            row.appendChild(value);

            notes.appendChild(row);
          }
        );

        legend.classList.add('visible');
      }


      function setActiveLayer(key) {

        activeKey = key;

        Object.keys(
          survey.layers
        ).forEach(
          function (layerKey) {

            const layerId =
              'survey-' +
              layerKey +
              '-layer';

            if (map.getLayer(layerId)) {

              map.setLayoutProperty(
                layerId,
                'visibility',
                layerKey === key
                  ? 'visible'
                  : 'none'
              );

            }

            const button =
              document.querySelector(
                '[data-layer="' +
                layerKey +
                '"]'
              );

            if (button) {

              button.classList.toggle(
                'active',
                layerKey === key
              );

            }

          }
        );

        setLegend(
          survey.layers[key]
        );

        status.textContent =
          survey.layers[key].label +
          ' layer enabled.';
      }


      /*
       * Create RGB / NDVI / GNDVI buttons
       */
      const tabs =
        document.getElementById('layerTabs');

      Object.keys(
        survey.layers
      ).forEach(
        function (key) {

          const layer =
            survey.layers[key];

          const button =
            document.createElement('button');

          button.className =
            'layer-btn' +
            (
              key === activeKey
                ? ' active'
                : ''
            );

          button.type =
            'button';

          button.dataset.layer =
            key;

          button.textContent =
            layer.label;

          button.addEventListener(
            'click',
            function () {
              setActiveLayer(key);
            }
          );

          tabs.appendChild(button);
        }
      );


      /*
       * Add survey layers after basemap loads
       */
      map.on(
        'load',
        function () {

          Object.keys(
            survey.layers
          ).forEach(
            function (key) {

              const layer =
                survey.layers[key];

              map.addSource(
                'survey-' + key,
                {

                  type: 'raster',

                  tiles: [
                    layer.tiles
                  ],

                  tileSize: 256,

                  minzoom:
                    layer.minzoom || 14,

                  maxzoom:
                    layer.maxzoom || 20,

                  scheme:
                    layer.scheme || 'tms'
                }
              );


              map.addLayer(
                {

                  id:
                    'survey-' +
                    key +
                    '-layer',

                  type:
                    'raster',

                  source:
                    'survey-' + key,

                  layout: {

                    visibility:
                      key === activeKey
                        ? 'visible'
                        : 'none'

                  },

                  paint: {

                    'raster-opacity': 1

                  }

                }
              );

            }
          );


          fitSurvey();

          setLegend(
            survey.layers[activeKey]
          );

          status.textContent =
            'RGB orthomosaic enabled.';
        }
      );


      /*
       * Map errors
       */
      map.on(
        'error',
        function (event) {

          console.error(
            'MapLibre error:',
            event && event.error
              ? event.error
              : event
          );

          status.textContent =
            'A map resource failed to load. Check DevTools Console.';
        }
      );


      /*
       * Fit button
       */
      document.getElementById(
        'fitBtn'
      ).addEventListener(
        'click',
        fitSurvey
      );


      /*
       * Opacity slider
       */
      const opacity =
        document.getElementById('opacity');

      const opacityValue =
        document.getElementById(
          'opacityValue'
        );

      opacity.addEventListener(
        'input',
        function () {

          const value =
            Number(opacity.value) / 100;

          opacityValue.value =
            opacity.value + '%';

          Object.keys(
            survey.layers
          ).forEach(
            function (key) {

              const layerId =
                'survey-' +
                key +
                '-layer';

              if (map.getLayer(layerId)) {

                map.setPaintProperty(
                  layerId,
                  'raster-opacity',
                  value
                );

              }

            }
          );

        }
      );

    })();
  </script>

</body>
</html>

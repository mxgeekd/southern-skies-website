<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Property - Southern Skies Agritech</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.7.3/dist/maplibre-gl.css">
<style>
:root{--g:#1f6f43;--ink:#19231c;--muted:#66736a;--line:#dce4de;--soft:#f2f5f3}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--ink);background:var(--soft)}
.wrap{max-width:1120px;margin:auto;padding:0 20px}.top{background:#fff;border-bottom:1px solid var(--line);padding:16px 0}
.ey{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--g);font-weight:800}
h1{margin:4px 0 3px}.sub{color:var(--muted)}main{padding:22px 0 45px}.crumb{font-size:13px;margin-bottom:14px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1.45fr .8fr;gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 5px 20px #0000000d}
#map{height:460px;border-radius:14px}.pad{padding:18px}.sec{font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;margin-bottom:12px}
.paddock{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:12px}
.paddock h3{margin:0 0 5px}.paddock p{margin:0;color:var(--muted);font-size:13px}.badges{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.badge{font-size:12px;background:#edf5f0;padding:5px 8px;border-radius:999px}
@media(max-width:760px){.grid{grid-template-columns:1fr}#map{height:360px}.wrap{padding:0 14px}}
</style><link rel="stylesheet" href="/maps/tools/map-tools.css"></head>
<body><div class="top"><div class="wrap"><div class="ey">Southern Skies Agritech</div><h1 id="name">Property</h1><div class="sub" id="subtitle"></div></div></div>
<main><div class="wrap"><div class="crumb"><a href="/">Southern Skies Agritech</a> / <span id="crumbName"></span></div>
<div class="grid"><div class="card"><div id="map"></div></div><div class="card pad"><div class="sec">Paddocks</div><div id="list"></div></div></div></div></main>
<script src="/maps/config.js"></script>
<script src="https://unpkg.com/maplibre-gl@5.7.3/dist/maplibre-gl.js"></script>
<script>
(async function(){
const data=await fetch('./property.json').then(r=>r.json());
document.getElementById('name').textContent=data.name;document.getElementById('crumbName').textContent=data.name;document.getElementById('subtitle').textContent=data.subtitle||'Property imagery and survey history';document.title=data.name+' - Southern Skies Agritech';
data.paddocks.forEach(p=>{const latest=p.surveys[p.surveys.length-1],a=document.createElement('a'),h3=document.createElement('h3'),desc=document.createElement('p'),badges=document.createElement('div'),count=document.createElement('span');a.className='paddock';a.href='./'+p.id+'/';h3.textContent=p.name;desc.textContent=p.description||'';badges.className='badges';count.className='badge';count.textContent=`${p.surveys.length} survey${p.surveys.length===1?'':'s'}`;badges.appendChild(count);if(latest){const latestBadge=document.createElement('span');latestBadge.className='badge';latestBadge.textContent='Latest: '+latest.dateLabel;badges.appendChild(latestBadge)}a.append(h3,desc,badges);document.getElementById('list').appendChild(a)});
const key=window.SSA_CONFIG?.ESRI_API_KEY||'';let style={version:8,sources:{},layers:[]};
try{const r=await fetch(`https://basemapstyles-api.arcgis.com/arcgis/rest/services/styles/v2/styles/arcgis/imagery/standard?token=${encodeURIComponent(key)}`);if(r.ok)style=await r.json()}catch(e){}
style.sources=style.sources||{};style.layers=style.layers||[];
const centers=data.paddocks.flatMap(p=>p.surveys.slice(-1).map(s=>s.center));const c=centers[0]||[152.37,-30.81];
const map=new maplibregl.Map({container:'map',style,center:c,zoom:15});window.__ssaPropertyMap=map;map.addControl(new maplibregl.NavigationControl(),'top-right');
map.on('load',()=>{const fs=data.paddocks.filter(p=>p.surveys.length).map(p=>{const s=p.surveys[p.surveys.length-1],b=s.bounds;return {type:'Feature',properties:{page:'./'+p.id+'/'},geometry:{type:'Polygon',coordinates:[[[b[0][0],b[0][1]],[b[1][0],b[0][1]],[b[1][0],b[1][1]],[b[0][0],b[1][1]],[b[0][0],b[0][1]]]]}}});if(fs.length){map.addSource('p',{type:'geojson',data:{type:'FeatureCollection',features:fs}});map.addLayer({id:'pf',type:'fill',source:'p',paint:{'fill-color':'#1f6f43','fill-opacity':.18}});map.addLayer({id:'pl',type:'line',source:'p',paint:{'line-color':'#1f6f43','line-width':2}});map.on('click','pf',e=>location.href=e.features[0].properties.page);}});
})();
</script><script src="/maps/tools/map-tools.js"></script><script>window.addEventListener('load',()=>setTimeout(()=>{try{if(window.__ssaPropertyMap)new SSAMapTools({map:window.__ssaPropertyMap,fileNameBase:'property-layer'})}catch(e){console.warn(e)}},500));</script></body></html>

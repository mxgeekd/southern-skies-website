<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paddock</title><style>body{font-family:Arial;margin:0;background:#f2f5f3;color:#19231c}.w{max-width:1050px;margin:auto;padding:22px}.c{background:white;border:1px solid #dce4de;border-radius:14px;padding:18px;margin-top:14px}.b{display:inline-block;padding:9px 12px;background:#1f6f43;color:#fff;text-decoration:none;border-radius:8px;font-weight:700}.e{font-size:11px;letter-spacing:.1em;color:#1f6f43;font-weight:800;text-transform:uppercase}.ev{border:1px solid #dce4de;border-radius:10px;padding:14px;margin:10px 0}select{padding:9px;margin:5px}</style></head><body><div class="w"><div class="e">Southern Skies Agritech</div><a href="../">← Property</a><h1 id="n">Paddock</h1><div class="c"><h3>Survey history</h3><div id="t"></div></div><div class="c" id="cc"><h3>Compare surveys</h3><select id="a"></select><select id="b"></select><a id="go" class="b" href="#">Open swipe comparison</a></div></div><script>(async()=>{const pid='trc1',d=await fetch('../property.json').then(r=>r.json()),p=d.paddocks.find(x=>x.id===pid),s=[...p.surveys].sort((x,y)=>y.date.localeCompare(x.date));n.textContent=p.name;document.title=p.name+' — '+d.name;s.forEach(x=>{const e=document.createElement('div');e.className='ev';e.innerHTML='<b>'+x.dateLabel+'</b><br>'+Object.values(x.layers).map(v=>v.label).join(' · ')+'<br><br><a class="b" href="/maps/view/?client='+encodeURIComponent(d.id)+'&paddock='+encodeURIComponent(p.id)+'&date='+x.date+'">View imagery</a>';t.appendChild(e)});if(s.length<2){cc.style.display='none';return}const q=[...s].reverse();q.forEach(x=>{a.add(new Option(x.dateLabel,x.date));b.add(new Option(x.dateLabel,x.date))});a.value=q[0].date;b.value=q.at(-1).date;function u(){go.href='/maps/compare/?client='+encodeURIComponent(d.id)+'&paddock='+encodeURIComponent(p.id)+'&left='+a.value+'&right='+b.value+'&layer=ndvi'}a.onchange=b.onchange=u;u()})()</script></body></html>

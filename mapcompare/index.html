
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Southern Skies Agritech — Compare</title>

  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.7.3/dist/maplibre-gl.css">

  <style>
    :root {
      --panel: rgba(255,255,255,.97);
      --ink: #172019;
      --muted: #607065;
      --green: #1f6f43;
      --green-dark: #155432;
      --border: #dbe4dd;
      --line: rgba(255,255,255,.95);
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: var(--ink);
      overflow: hidden;
    }

    #map {
      position: absolute;
      inset: 0;
    }

    .panel {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 10;
      width: min(390px, calc(100vw - 28px));
      max-height: calc(100vh - 28px);
      overflow: auto;
      background: var(--panel);
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,.24);
      padding: 16px;
      box-sizing: border-box;
      border: 1px solid rgba(0,0,0,.06);
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--green);
      font-weight: 700;
      margin-bottom: 5px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
    }

    .meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .section {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: #344239;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .control-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .control-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      background: #f8faf9;
    }

    .control-card h3 {
      margin: 0 0 8px 0;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: #38483d;
    }

    select {
      width: 100%;
      appearance: none;
      border: 1px solid #cfd9d2;
      background: white;
      color: #27332b;
      padding: 9px 8px;
      border-radius: 8px;
      font-weight: 700;
      box-sizing: border-box;
      margin-bottom: 8px;
    }

    .layer-tabs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 7px;
    }

    .layer-btn {
      appearance: none;
      border: 1px solid #cfd9d2;
      background: #f7faf8;
      color: #27332b;
      padding: 9px 8px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    .layer-btn:hover {
      background: #edf4ef;
    }

    .layer-btn.active {
      background: var(--green);
      color: #fff;
      border-color: var(--green);
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    button.action {
      border: 0;
      border-radius: 8px;
      padding: 9px 11px;
      background: var(--green);
      color: white;
      cursor: pointer;
      font-weight: 700;
    }

    button.action:hover {
      background: var(--green-dark);
    }

    .status {
      margin-top: 12px;
      font-size: 11px;
      line-height: 1.45;
      color: var(--muted);
    }

    .swipe-handle {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--line);
      box-shadow: 0 0 0 1px rgba(0,0,0,.18);
      z-index: 8;
      cursor: ew-resize;
      touch-action: none;
    }

    .swipe-knob {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255,255,255,.96);
      border: 1px solid rgba(0,0,0,.18);
      box-shadow: 0 3px 12px rgba(0,0,0,.25);
      display: grid;
      place-items: center;
      font-size: 20px;
      color: #33443a;
      user-select: none;
    }

    .compare-label {
      position: absolute;
      top: 14px;
      z-index: 7;
      background: rgba(255,255,255,.93);
      border: 1px solid rgba(0,0,0,.08);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 2px 10px rgba(0,0,0,.12);
      pointer-events: none;
    }

    #leftLabel {
      left: 420px;
    }

    #rightLabel {
      right: 58px;
    }

    .maplibregl-ctrl-attrib {
      font-size: 10px;
    }

    @media (max-width: 760px) {
      .panel {
        top: 8px;
        left: 8px;
        width: calc(100vw - 16px);
        padding: 13px;
      }

      .compare-label {
        top: auto;
        bottom: 34px;
      }

      #leftLabel {
        left: 10px;
      }

      #rightLabel {
        right: 10px;
      }

      .control-grid {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <div class="panel">
    <div class="eyebrow">Southern Skies Agritech</div>
    <h1>Towal Creek Comparison</h1>
    <div class="meta">Swipe between two imagery layers</div>

    <div class="section">
      <div class="section-title">Paddock</div>
      <select id="paddockSelect"></select>
    </div>

    <div class="section">
      <div class="section-title">Compare</div>

      <div class="control-grid">
        <div class="control-card">
          <h3>Left</h3>
          <select id="leftDate"></select>
          <select id="leftLayer"></select>
        </div>

        <div class="control-card">
          <h3>Right</h3>
          <select id="rightDate"></select>
          <select id="rightLayer"></select>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Basemap</div>
      <div class="layer-tabs">
        <button class="layer-btn active" id="mapBasemapBtn" type="button">Map</button>
        <button class="layer-btn" id="satelliteBasemapBtn" type="button">Satellite</button>
      </div>

      <div class="actions">
        <button class="action" id="fitBtn" type="button">Fit survey</button>
        <button class="action" id="centerSwipeBtn" type="button">Centre swipe</button>
      </div>

      <div class="status" id="status">Loading map...</div>
    </div>
  </div>

  <div class="compare-label" id="leftLabel">Left</div>
  <div class="compare-label" id="rightLabel">Right</div>

  <div class="swipe-handle" id="swipeHandle">
    <div class="swipe-knob">↔</div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@5.7.3/dist/maplibre-gl.js"></script>

  <script>
    (async function () {

      /* =========================================================
         API KEY — THIS IS THE ONLY API KEY TO REPLACE
         =========================================================
         Search this file for:
         REPLACE_WITH_YOUR_ARCGIS_API_KEY
      */
      const ESRI_API_KEY = 'AAPTagPaE_90QGccsyzPLnRE4Cg..TvuUowd1TLpfnMBY81AHr82_9fY59SLQRn83OCQYB7I2KR7Ol1ZFgX-4-FArM1-ZhG9XLxQ87w-7NPCjch6dl2wObSko4Yz2A0uqBbL_p_kzZ-dVw9BVx4tYoC9ZmGnYwIm_3GJuFVszijxgo_-yXWzuHaqJweNucXYceuC2gg4UVt2CDwJ5GGbAlCRI8d9xdEdIdhqPa9Aggs3AIdd_62oyvNjkROBYcEit02g7f90eJ6DRjWJpsA..AT1_6PqmzSJc';

      /* =========================================================
         SURVEY CATALOGUE
         Currently includes the data already uploaded to R2.
         Add future dates here later.
         ========================================================= */
      const catalogue = {
        property: 'Towal Creek',
        paddocks: [
          {
            id: 'paddock-1-2',
            label: 'Paddock 1 + 2',
            dates: [
              {
                id: '2026-08-29',
                label: '29 Aug 2026',
                bounds: [
                  [152.3701247, -30.8110960],
                  [152.3766099, -30.8080951]
                ],
                center: [152.3733673, -30.8095955],
                layers: {
                  rgb: {
                    label: 'RGB',
                    tiles: 'https://maps.southernskiesagritech.com.au/towal-creek/2026-08-29/paddock-1-2/rgb/{z}/{x}/{y}.png',
                    scheme: 'tms',
                    minzoom: 14,
                    maxzoom: 20
                  },
                  ndvi: {
                    label: 'NDVI',
                    tiles: 'https://maps.southernskiesagritech.com.au/towal-creek/2026-08-29/paddock-1-2/ndvi/{z}/{x}/{y}.png',
                    scheme: 'tms',
                    minzoom: 14,
                    maxzoom: 20
                  },
                  gndvi: {
                    label: 'GNDVI',
                    tiles: 'https://maps.southernskiesagritech.com.au/towal-creek/2026-08-29/paddock-1-2/gndvi/{z}/{x}/{y}.png',
                    scheme: 'tms',
                    minzoom: 14,
                    maxzoom: 20
                  }
                }
              }
            ]
          }
        ]
      };

      const paddockSelect = document.getElementById('paddockSelect');
      const leftDateSelect = document.getElementById('leftDate');
      const rightDateSelect = document.getElementById('rightDate');
      const leftLayerSelect = document.getElementById('leftLayer');
      const rightLayerSelect = document.getElementById('rightLayer');
      const mapBasemapBtn = document.getElementById('mapBasemapBtn');
      const satelliteBasemapBtn = document.getElementById('satelliteBasemapBtn');
      const status = document.getElementById('status');
      const swipeHandle = document.getElementById('swipeHandle');
      const leftLabel = document.getElementById('leftLabel');
      const rightLabel = document.getElementById('rightLabel');

      let map;
      let currentPaddock = catalogue.paddocks[0];
      let leftDate = currentPaddock.dates[0];
      let rightDate = currentPaddock.dates[0];
      let leftLayerKey = 'rgb';
      let rightLayerKey = 'ndvi';
      let esriLayerIds = [];
      let swipeX = window.innerWidth / 2;
      let dragging = false;

      function setStatus(message) {
        status.textContent = message;
      }

      function fillPaddockSelect() {
        paddockSelect.innerHTML = '';

        catalogue.paddocks.forEach(function (paddock) {
          const option = document.createElement('option');
          option.value = paddock.id;
          option.textContent = paddock.label;
          paddockSelect.appendChild(option);
        });

        paddockSelect.value = currentPaddock.id;
      }

      function fillDateSelect(select, selectedDate) {
        select.innerHTML = '';

        currentPaddock.dates.forEach(function (date) {
          const option = document.createElement('option');
          option.value = date.id;
          option.textContent = date.label;
          select.appendChild(option);
        });

        select.value = selectedDate.id;
      }

      function fillLayerSelect(select, date, selectedLayerKey) {
        select.innerHTML = '';

        Object.keys(date.layers).forEach(function (key) {
          const option = document.createElement('option');
          option.value = key;
          option.textContent = date.layers[key].label;
          select.appendChild(option);
        });

        if (!date.layers[selectedLayerKey]) {
          selectedLayerKey = Object.keys(date.layers)[0];
        }

        select.value = selectedLayerKey;
        return selectedLayerKey;
      }

      function getDateById(id) {
        return currentPaddock.dates.find(function (item) {
          return item.id === id;
        });
      }

      function sourceBounds(date) {
        return [
          date.bounds[0][0],
          date.bounds[0][1],
          date.bounds[1][0],
          date.bounds[1][1]
        ];
      }

      function removeCompareLayers() {
        ['compare-left-layer', 'compare-right-layer'].forEach(function (id) {
          if (map.getLayer(id)) map.removeLayer(id);
        });

        ['compare-left', 'compare-right'].forEach(function (id) {
          if (map.getSource(id)) map.removeSource(id);
        });
      }

      function addCompareLayers() {
        const leftLayer = leftDate.layers[leftLayerKey];
        const rightLayer = rightDate.layers[rightLayerKey];

        map.addSource('compare-left', {
          type: 'raster',
          tiles: [leftLayer.tiles],
          tileSize: 256,
          minzoom: leftLayer.minzoom || 14,
          maxzoom: leftLayer.maxzoom || 20,
          scheme: leftLayer.scheme || 'tms',
          bounds: sourceBounds(leftDate)
        });

        map.addSource('compare-right', {
          type: 'raster',
          tiles: [rightLayer.tiles],
          tileSize: 256,
          minzoom: rightLayer.minzoom || 14,
          maxzoom: rightLayer.maxzoom || 20,
          scheme: rightLayer.scheme || 'tms',
          bounds: sourceBounds(rightDate)
        });

        map.addLayer({
          id: 'compare-left-layer',
          type: 'raster',
          source: 'compare-left'
        });

        map.addLayer({
          id: 'compare-right-layer',
          type: 'raster',
          source: 'compare-right'
        });

        updateLabels();
        updateSwipe();
      }

      function rebuildCompareLayers() {
        if (!map || !map.loaded()) return;
        removeCompareLayers();
        addCompareLayers();
      }

      function updateLabels() {
        leftLabel.textContent =
          leftDate.label + ' · ' + leftDate.layers[leftLayerKey].label;

        rightLabel.textContent =
          rightDate.label + ' · ' + rightDate.layers[rightLayerKey].label;
      }

      function fitSurvey() {
        if (!map) return;

        const b = leftDate.bounds;

        map.fitBounds(
          b,
          {
            padding: 60,
            maxZoom: 19
          }
        );
      }

      function setBasemap(type) {
        const satellite = type === 'satellite';

        if (map.getLayer('ssa-osm')) {
          map.setLayoutProperty(
            'ssa-osm',
            'visibility',
            satellite ? 'none' : 'visible'
          );
        }

        esriLayerIds.forEach(function (layerId) {
          if (map.getLayer(layerId)) {
            map.setLayoutProperty(
              layerId,
              'visibility',
              satellite ? 'visible' : 'none'
            );
          }
        });

        mapBasemapBtn.classList.toggle('active', !satellite);
        satelliteBasemapBtn.classList.toggle('active', satellite);

        setStatus(
          satellite
            ? 'Satellite basemap enabled.'
            : 'Map basemap enabled.'
        );
      }

      function updateSwipe() {
        if (!map) return;

        const width = map.getContainer().clientWidth;
        const x = Math.max(0, Math.min(swipeX, width));

        swipeHandle.style.left = (x - 1.5) + 'px';

        /*
         * Use MapLibre raster clipping.
         * Left layer is shown only on the left side of the divider.
         * Right layer is shown only on the right side.
         */
        if (map.getLayer('compare-left-layer')) {
          map.setPaintProperty(
            'compare-left-layer',
            'raster-opacity',
            [
              'interpolate',
              ['linear'],
              ['get', '__screen_x__'],
              0, 1,
              x, 1,
              x + 1, 0,
              width, 0
            ]
          );
        }

        if (map.getLayer('compare-right-layer')) {
          map.setPaintProperty(
            'compare-right-layer',
            'raster-opacity',
            [
              'interpolate',
              ['linear'],
              ['get', '__screen_x__'],
              0, 0,
              x - 1, 0,
              x, 1,
              width, 1
            ]
          );
        }
      }

      /*
       * Fallback swipe implementation:
       * MapLibre does not expose screen X as a feature property for raster layers,
       * so we clip the canvas visually using two synchronized map containers.
       * This page keeps one master map and duplicates the canvas display area.
       */
      function applyVisualClip() {
        const container = map.getContainer();
        const canvases = container.querySelectorAll('.maplibregl-canvas');

        if (!canvases.length) return;

        const width = container.clientWidth;
        const x = Math.max(0, Math.min(swipeX, width));

        swipeHandle.style.left = (x - 1.5) + 'px';

        /*
         * We use MapLibre's layer visibility plus canvas clipping via CSS masks
         * below by controlling the right layer through a custom WebGL scissor
         * hook registered after each render.
         */
      }

      /*
       * Reliable WebGL swipe: use scissor test while rendering the top raster
       * isn't exposed cleanly by MapLibre public API, so for this first version
       * we instead run two perfectly synchronized MapLibre maps stacked together.
       */
      function createSwipeMaps(baseStyle) {
        const main = document.getElementById('map');
        main.innerHTML = '';

        const leftMapDiv = document.createElement('div');
        leftMapDiv.id = 'leftMap';
        leftMapDiv.style.position = 'absolute';
        leftMapDiv.style.inset = '0';

        const rightWrap = document.createElement('div');
        rightWrap.id = 'rightWrap';
        rightWrap.style.position = 'absolute';
        rightWrap.style.inset = '0';
        rightWrap.style.overflow = 'hidden';
        rightWrap.style.pointerEvents = 'none';

        const rightMapDiv = document.createElement('div');
        rightMapDiv.id = 'rightMap';
        rightMapDiv.style.position = 'absolute';
        rightMapDiv.style.inset = '0';
        rightMapDiv.style.width = window.innerWidth + 'px';
        rightMapDiv.style.height = window.innerHeight + 'px';

        rightWrap.appendChild(rightMapDiv);
        main.appendChild(leftMapDiv);
        main.appendChild(rightWrap);

        return { leftMapDiv, rightWrap, rightMapDiv };
      }

      fillPaddockSelect();
      fillDateSelect(leftDateSelect, leftDate);
      fillDateSelect(rightDateSelect, rightDate);
      leftLayerKey = fillLayerSelect(leftLayerSelect, leftDate, leftLayerKey);
      rightLayerKey = fillLayerSelect(rightLayerSelect, rightDate, rightLayerKey);
      updateLabels();

      const ESRI_STYLE_URL =
        'https://basemapstyles-api.arcgis.com/' +
        'arcgis/rest/services/styles/v2/styles/' +
        'arcgis/imagery/standard' +
        '?token=' +
        encodeURIComponent(ESRI_API_KEY);

      let esriStyle;

      try {
        setStatus('Loading basemaps...');

        const response = await fetch(ESRI_STYLE_URL);

        if (!response.ok) {
          throw new Error('Esri returned HTTP ' + response.status);
        }

        esriStyle = await response.json();
      }
      catch (error) {
        console.error(error);
        esriStyle = { version: 8, sources: {}, layers: [] };
        setStatus('Satellite unavailable. Map mode still available.');
      }

      if (!esriStyle.sources) esriStyle.sources = {};
      if (!esriStyle.layers) esriStyle.layers = [];

      esriLayerIds = esriStyle.layers.map(function (layer) {
        return layer.id;
      });

      esriStyle.layers.forEach(function (layer) {
        if (!layer.layout) layer.layout = {};
        layer.layout.visibility = 'none';
      });

      esriStyle.sources.ssa_osm = {
        type: 'raster',
        tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
        tileSize: 256,
        maxzoom: 19,
        attribution: '© OpenStreetMap contributors'
      };

      esriStyle.layers.unshift({
        id: 'ssa-osm',
        type: 'raster',
        source: 'ssa_osm',
        layout: { visibility: 'visible' }
      });

      const mapShell = createSwipeMaps(esriStyle);

      const leftMap = new maplibregl.Map({
        container: 'leftMap',
        center: leftDate.center,
        zoom: 16,
        attributionControl: true,
        style: JSON.parse(JSON.stringify(esriStyle))
      });

      const rightMap = new maplibregl.Map({
        container: 'rightMap',
        center: rightDate.center,
        zoom: 16,
        attributionControl: false,
        interactive: false,
        style: JSON.parse(JSON.stringify(esriStyle))
      });

      map = leftMap;

      leftMap.addControl(new maplibregl.NavigationControl(), 'top-right');
      leftMap.addControl(new maplibregl.FullscreenControl(), 'top-right');

      function addSideLayer(targetMap, sourceId, layerId, date, layerKey) {
        const layer = date.layers[layerKey];

        if (targetMap.getLayer(layerId)) targetMap.removeLayer(layerId);
        if (targetMap.getSource(sourceId)) targetMap.removeSource(sourceId);

        targetMap.addSource(sourceId, {
          type: 'raster',
          tiles: [layer.tiles],
          tileSize: 256,
          minzoom: layer.minzoom || 14,
          maxzoom: layer.maxzoom || 20,
          scheme: layer.scheme || 'tms',
          bounds: sourceBounds(date)
        });

        targetMap.addLayer({
          id: layerId,
          type: 'raster',
          source: sourceId
        });
      }

      function refreshSideLayers() {
        if (!leftMap.loaded() || !rightMap.loaded()) return;

        addSideLayer(
          leftMap,
          'left-compare-source',
          'left-compare-layer',
          leftDate,
          leftLayerKey
        );

        addSideLayer(
          rightMap,
          'right-compare-source',
          'right-compare-layer',
          rightDate,
          rightLayerKey
        );

        updateLabels();
      }

      function syncRightMap() {
        const center = leftMap.getCenter();

        rightMap.jumpTo({
          center: [center.lng, center.lat],
          zoom: leftMap.getZoom(),
          bearing: leftMap.getBearing(),
          pitch: leftMap.getPitch()
        });
      }

      function updateRightClip() {
        const width = window.innerWidth;
        const x = Math.max(0, Math.min(swipeX, width));

        swipeHandle.style.left = (x - 1.5) + 'px';

        mapShell.rightWrap.style.left = x + 'px';
        mapShell.rightMapDiv.style.left = (-x) + 'px';
        mapShell.rightMapDiv.style.width = width + 'px';
        mapShell.rightMapDiv.style.height = window.innerHeight + 'px';

        rightMap.resize();
        syncRightMap();
      }

      Promise.all([
        new Promise(function (resolve) {
          leftMap.on('load', resolve);
        }),
        new Promise(function (resolve) {
          rightMap.on('load', resolve);
        })
      ]).then(function () {
        refreshSideLayers();
        fitSurvey();
        updateRightClip();
        setStatus('Swipe comparison ready.');
      });

      leftMap.on('move', syncRightMap);
      leftMap.on('resize', updateRightClip);

      mapBasemapBtn.addEventListener('click', function () {
        [leftMap, rightMap].forEach(function (m) {
          if (m.getLayer('ssa-osm')) {
            m.setLayoutProperty('ssa-osm', 'visibility', 'visible');
          }

          esriLayerIds.forEach(function (layerId) {
            if (m.getLayer(layerId)) {
              m.setLayoutProperty(layerId, 'visibility', 'none');
            }
          });
        });

        mapBasemapBtn.classList.add('active');
        satelliteBasemapBtn.classList.remove('active');
        setStatus('Map basemap enabled.');
      });

      satelliteBasemapBtn.addEventListener('click', function () {
        [leftMap, rightMap].forEach(function (m) {
          if (m.getLayer('ssa-osm')) {
            m.setLayoutProperty('ssa-osm', 'visibility', 'none');
          }

          esriLayerIds.forEach(function (layerId) {
            if (m.getLayer(layerId)) {
              m.setLayoutProperty(layerId, 'visibility', 'visible');
            }
          });
        });

        satelliteBasemapBtn.classList.add('active');
        mapBasemapBtn.classList.remove('active');
        setStatus('Satellite basemap enabled.');
      });

      paddockSelect.addEventListener('change', function () {
        currentPaddock = catalogue.paddocks.find(function (paddock) {
          return paddock.id === paddockSelect.value;
        }) || catalogue.paddocks[0];

        leftDate = currentPaddock.dates[0];
        rightDate = currentPaddock.dates[0];

        fillDateSelect(leftDateSelect, leftDate);
        fillDateSelect(rightDateSelect, rightDate);

        leftLayerKey = fillLayerSelect(leftLayerSelect, leftDate, leftLayerKey);
        rightLayerKey = fillLayerSelect(rightLayerSelect, rightDate, rightLayerKey);

        refreshSideLayers();
        fitSurvey();
      });

      leftDateSelect.addEventListener('change', function () {
        leftDate = getDateById(leftDateSelect.value) || currentPaddock.dates[0];
        leftLayerKey = fillLayerSelect(leftLayerSelect, leftDate, leftLayerKey);
        refreshSideLayers();
      });

      rightDateSelect.addEventListener('change', function () {
        rightDate = getDateById(rightDateSelect.value) || currentPaddock.dates[0];
        rightLayerKey = fillLayerSelect(rightLayerSelect, rightDate, rightLayerKey);
        refreshSideLayers();
      });

      leftLayerSelect.addEventListener('change', function () {
        leftLayerKey = leftLayerSelect.value;
        refreshSideLayers();
      });

      rightLayerSelect.addEventListener('change', function () {
        rightLayerKey = rightLayerSelect.value;
        refreshSideLayers();
      });

      document.getElementById('fitBtn').addEventListener('click', function () {
        const b = leftDate.bounds;

        leftMap.fitBounds(
          b,
          {
            padding: 60,
            maxZoom: 19
          }
        );
      });

      document.getElementById('centerSwipeBtn').addEventListener(
        'click',
        function () {
          swipeX = window.innerWidth / 2;
          updateRightClip();
        }
      );

      function beginDrag(event) {
        dragging = true;
        event.preventDefault();
      }

      function drag(event) {
        if (!dragging) return;

        const clientX =
          event.touches && event.touches.length
            ? event.touches[0].clientX
            : event.clientX;

        swipeX = clientX;
        updateRightClip();
      }

      function endDrag() {
        dragging = false;
      }

      swipeHandle.addEventListener('mousedown', beginDrag);
      swipeHandle.addEventListener('touchstart', beginDrag, { passive: false });

      window.addEventListener('mousemove', drag);
      window.addEventListener('touchmove', drag, { passive: false });

      window.addEventListener('mouseup', endDrag);
      window.addEventListener('touchend', endDrag);

      window.addEventListener('resize', function () {
        swipeX = Math.min(swipeX, window.innerWidth);
        updateRightClip();
      });

    })();
  </script>
</body>
</html>

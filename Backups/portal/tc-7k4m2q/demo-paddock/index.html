<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo Paddock — Towal Creek</title><style>
:root{--green:#1f6f43;--green2:#155432;--ink:#19231c;--muted:#657268;--line:#dce4de;--soft:#f5f8f6;--card:#fff}*{box-sizing:border-box}html,body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#f2f5f3}a{color:inherit}.topbar{background:#fff;border-bottom:1px solid var(--line)}.wrap{max-width:1120px;margin:auto;padding:0 20px}.brand{padding:18px 0}.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--green);font-weight:800}.brand h1{margin:4px 0 0;font-size:25px}.brand p{margin:5px 0 0;color:var(--muted)}main{padding:24px 0 48px}.hero-grid{display:grid;grid-template-columns:1.45fr .8fr;gap:18px;align-items:start}.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 5px 20px rgba(0,0,0,.05)}.card-pad{padding:18px}.section-title{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#425048;font-weight:800;margin:0 0 12px}.timeline{position:relative;margin-top:4px}.timeline:before{content:"";position:absolute;left:12px;top:6px;bottom:6px;width:2px;background:#dce6df}.event{position:relative;padding-left:38px;margin-bottom:18px}.event:before{content:"";position:absolute;left:5px;top:7px;width:16px;height:16px;border-radius:50%;background:var(--green);border:3px solid #fff;box-shadow:0 0 0 1px #b8cabd}.event-card{padding:16px;border:1px solid var(--line);border-radius:12px;background:#fff}.event-date{font-size:12px;font-weight:800;color:var(--green);text-transform:uppercase;letter-spacing:.04em}.event-card h3{margin:5px 0 6px}.event-card p{margin:0;color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{display:inline-block;text-decoration:none;border:0;background:var(--green);color:#fff;padding:10px 13px;border-radius:9px;font-weight:800;cursor:pointer}.btn.secondary{background:#edf4ef;color:#25402e;border:1px solid #cfdbd3}.breadcrumbs{font-size:13px;color:var(--muted);margin-bottom:14px}.breadcrumbs a{text-decoration:none;color:var(--green)}.compare-box{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;color:#536159;margin-bottom:5px}select{width:100%;padding:9px;border:1px solid #cfd9d2;border-radius:8px;background:#fff;font-weight:700}@media(max-width:760px){.wrap{padding:0 14px}.brand{padding:14px 0}.brand h1{font-size:22px}main{padding-top:14px}.hero-grid{grid-template-columns:1fr}.card-pad{padding:14px}.compare-grid{grid-template-columns:1fr 1fr}}
</style></head><body>
<header class="topbar"><div class="wrap brand"><div class="eyebrow">Southern Skies Agritech</div><h1>Demo Paddock</h1><p>Towal Creek</p></div></header>
<main><div class="wrap"><div class="breadcrumbs"><a href="../">← Towal Creek</a> / Demo Paddock</div><div class="hero-grid">
<div class="card card-pad"><div class="section-title">Survey history</div><div id="timeline" class="timeline"></div></div>
<div class="card card-pad"><div class="section-title">Paddock</div><h2 style="margin:0 0 8px">Demo Paddock</h2><p id="summary" style="color:var(--muted);line-height:1.5;margin:0"></p><div id="latestActions" class="actions"></div>
<div class="compare-box" id="compareBox"><div class="section-title">Compare surveys</div><div class="compare-grid"><div><label for="compareLeft">Earlier / left</label><select id="compareLeft"></select></div><div><label for="compareRight">Later / right</label><select id="compareRight"></select></div></div><button class="btn" id="compareBtn">Open swipe comparison</button></div></div>
</div></div></main>
<script>(async function(){const client='tc-7k4m2q',pid='demo-paddock';const data=await fetch('../property.json').then(r=>r.json());const p=data.paddocks.find(x=>x.id===pid);const surveys=[...p.surveys].sort((a,b)=>b.date.localeCompare(a.date));document.getElementById('summary').textContent=`${surveys.length} survey${surveys.length===1?'':'s'} available. Latest: ${surveys[0].dateLabel}.`;const view=d=>`/maps/view/?client=${client}&paddock=${pid}&date=${d}`;const compare=(a,b)=>`/maps/compare/?client=${client}&paddock=${pid}&left=${a}&right=${b}&layer=ndvi`;
const latest=document.getElementById('latestActions');latest.innerHTML=`<a class="btn" href="${view(surveys[0].date)}">View latest imagery</a>`;
const tl=document.getElementById('timeline');surveys.forEach(s=>{const div=document.createElement('div');div.className='event';div.innerHTML=`<div class="event-card"><div class="event-date">${s.dateLabel}</div><h3>${s.type||'Survey'}</h3><p>${Object.values(s.layers).map(x=>x.label).join(' · ')}</p><div class="actions"><a class="btn" href="${view(s.date)}">View imagery</a></div></div>`;tl.appendChild(div)});
const box=document.getElementById('compareBox'),L=document.getElementById('compareLeft'),R=document.getElementById('compareRight');if(surveys.length<2){box.style.display='none'}else{const chrono=[...surveys].sort((a,b)=>a.date.localeCompare(b.date));chrono.forEach(s=>{for(const sel of [L,R]){const o=document.createElement('option');o.value=s.date;o.textContent=s.dateLabel;sel.appendChild(o)}});L.value=chrono[0].date;R.value=chrono[chrono.length-1].date;document.getElementById('compareBtn').onclick=()=>location.href=compare(L.value,R.value)}})();</script></body></html>
